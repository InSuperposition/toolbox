# The local OpenBao is NOT a pitchfork daemon. It runs in-cluster as a
# tofu-owned raft StatefulSet (ADR 0016 — supersedes the ADR 0010
# machine-global `bao server` daemon). `mise run local:openbao:bootstrap`
# brings it up in the OrbStack cluster. Any machine that still has the old
# `global/openbao` pitchfork daemon registered removes it once, out of band:
#   pitchfork stop global/openbao && pitchfork daemons remove --global openbao

# Local cv_frontend demo deploy (docs/adr/0009-demo-consumer-is-local-
# container-not-k8s.md). `scripts/frontend-serve.sh` is the indirection this
# daemon runs — a deploy records the approved image in
# deploy/frontend/current-image.txt and restarts this daemon; it never
# rewrites this file. No `auto`: the operator (or `mise run frontend:deploy`)
# starts it explicitly, so a `cd` into the repo does not crash-loop on
# cv_frontend's known runtime bug. `retry = 0` for the same reason.
#
# NOTE: `pitchfork daemons remove`/`add` rewrites this file and drops these
# comments — edit it by hand.
[daemons.frontend]
run = "./scripts/frontend-serve.sh"
dir = "deploy/frontend"
retry = 0
ready_port = 44100

# The local OpenBao is NOT a pitchfork daemon. It runs in-cluster as a
# tofu-owned raft StatefulSet. `mise run local:openbao:bootstrap` brings it
# up in the OrbStack cluster. Any machine that still has an old
# `global/openbao` pitchfork daemon registered removes it once, out of band:
#   pitchfork stop global/openbao && pitchfork daemons remove --global openbao

# No daemons declared today — delivery of cv_frontend is in-cluster only,
# not through a pitchfork-supervised process.

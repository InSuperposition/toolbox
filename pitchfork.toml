[daemons.openbao]
run = "bao server -config=openbao/openbao.hcl"
dir = "environments/local"
auto = ["start", "stop"]
retry = 0
ready_delay = 2
ready_port = 8200

# Local cv_frontend demo deploy (docs/designs/digest-as-source-of-truth.md
# § T5b). `run.sh` is a FIXED indirection — never repoint it; `mise run
# consume` records the approved image in deploy/frontend/current-image.txt
# and restarts this daemon. No `auto`: the operator (or `mise run consume`)
# starts it explicitly, so a `cd` into the repo does not crash-loop on
# cv_frontend's known runtime bug. `retry = 0` for the same reason.
#
# NOTE: `pitchfork daemons remove`/`add` rewrites this file and drops these
# comments — edit it by hand.
[daemons.frontend]
run = "./run.sh"
dir = "deploy/frontend"
retry = 0
ready_port = 44100

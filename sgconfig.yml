# ast-grep boundary lint — enforces the concern dependency edges. Rules
# live in rules/boundary-*.yml. Run via the hk `ast-grep` step in the
# `fast` layer; `mise run check` covers it.
#
# Honest scope: mostly a lint over literal path strings and relative climbs
# in *shell* (boundary-shell-*, boundary-*-ref), plus one `language: yaml`
# rule forbidding a `script:` block in a Tekton manifest under ci/
# (boundary-no-embedded-shell.yml). ast-grep has no HCL grammar built in,
# so the tofu layer's edges are not covered here. The one tofu edge that IS
# enforced — no `kubernetes_*` / `kubernetes_manifest` resource — lives in
# the `no-kubernetes-tf` hk step (tests/check-tf-boundary.sh, a git grep).
# A full resolved-graph check is a deferred idea. Paths assembled from
# variables are not caught.
ruleDirs:
  - rules

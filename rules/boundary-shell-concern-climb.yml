id: boundary-shell-concern-climb
language: bash
severity: error
message: >-
  A relative-path climb crosses a concern boundary — two-or-more levels up,
  or up into a named sibling concern (deploy/ attestation/ modules/
  environments/). A concern reaches another only through an env seam or a
  mise-task call, never a literal `../` path. A single `$SCRIPT_DIR/../file`
  within the same concern is fine. See docs/designs/repo-structure.md.
files:
  - "**/*.sh"
ignores:
  - "**/tests/**"
  # TEMPORARY (→ Phase 4d): openbao-bootstrap.sh walks to repo root only to
  # write deploy/frontend/cosign-approval.pub; that write becomes a
  # `mise run attestation:export-pubkey` task call and the ../../.. climb
  # disappears. Paired with the same exception in boundary-shell-deploy-ref.
  - "environments/local/scripts/openbao-bootstrap.sh"
rule:
  all:
    - any:
        - { regex: "\\.\\./\\.\\./" }
        - { regex: "\\.\\./(deploy|attestation|modules|environments)/" }
    - any:
        - { kind: string_content }
        - { kind: word }
        - { kind: raw_string }

# Runs the full `mise run check` matrix (the hk `check` hook: shellcheck,
# pkl, tofu fmt/validate/test, cue fmt, ls-lint, ast-grep, bats,
# check-coverage) on every push and every PR to main.
#
# WHY: `hk`'s pre-push gate runs only `fast + tofu-validate`. The heavy
# matrix (bats spinning real OpenBao/docker daemons, `tofu test`) runs only
# when a human types `mise run check`. A push straight to main, or a
# web-UI commit, otherwise runs nothing. This workflow closes that gap
# (docs/designs/digest-as-source-of-truth.md § Phasing, T9a).
#
# ONE definition, two entry points: this job's body is the single line
# `mise run check`. Every step it runs is declared in hk.pkl — never
# copied here (CLAUDE.md § hk, § mise).
#
# REPORT-ONLY, BY DESIGN: main has no branch protection and this workflow
# adds none. On a solo repo `enforce_admins` is a false choice (off =
# every push exempt; on = a recurring break-glass ritual). A red `check`
# is a notification. Revisit if a second committer joins the repo.
#
# Every third-party action is pinned by commit SHA, not a tag — this
# repo's digest-over-tag thesis applied to its own CI.

name: check

on:
  push: {}
  pull_request:
    branches: [main]

# A push to main is NEVER cancelled — every commit that lands gets its own
# full matrix run to completion. Superseded feature-branch runs still
# cancel (the tip is what matters there).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    # Native arm64 (docs/adr/0008-arm64-only.md). The GitHub-hosted
    # ubuntu-24.04-arm image ships docker + buildx, which the [docker] bats
    # cases need.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      # Absolute — YAML does not expand `~`. OpenTofu copies providers here
      # on `tofu init`; actions/cache below persists it across runs so the
      # pinned `local` + `vault` provider binaries are not re-downloaded
      # every run (the .terraform.lock.hcl files pin the versions; this
      # skips the download, it is not an offline mode).
      TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
      # hk writes output.log (failing step's full un-interleaved capture)
      # and hk.log (its DEBUG trace) under HK_STATE_DIR. Pin it to a known
      # path so the "Upload hk logs" step can grab them — otherwise a check
      # failure points at a runner file that's gone. `/tmp` (not
      # `runner.temp` — that context is not available at job `env:` level,
      # and `/tmp` matches the existing pitchfork-supervisor.log path). The
      # ephemeral runner discards it after the job. output.log is
      # failure-only; a green run leaves just hk.log or nothing.
      HK_STATE_DIR: /tmp/hk
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v7.0.1

      - name: Cache OpenTofu provider plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.terraform.d/plugin-cache
          key: tofu-plugins-${{ runner.arch }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tofu-plugins-${{ runner.arch }}-

      - name: Create the provider plugin-cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Install pinned tools (mise.toml [tools])
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Pin the mise binary. Unpinned, mise-action reads
          # https://mise.jdx.dev/VERSION which briefly served 2026.9.3
          # before that GitHub release existed -> `curl ... 404` on the
          # install step (2026-09-08). This is the mise binary, separate
          # from the `aqua:jdx/mise` tool pin in mise.toml.
          version: 2026.9.2
          install: true
          cache: true

      # Assert the heavy matrix CAN run. deploy_docker_available() is
      # CI-fatal (it exits non-zero when CI is set and docker is absent),
      # so a runner-image regression that drops docker fails loudly here
      # instead of silently downgrading the [docker] bats cases to skips.
      - name: Assert docker is available
        run: |
          docker info
          docker buildx version

      # Start the pitchfork supervisor daemon HERE, with its stdin/stdout/
      # stderr bound to this step (closed when the step ends) and never to a
      # later step. Left lazy, it is spawned by the first `pitchfork` call
      # inside a bats case — inheriting the `hk` step's output pipe, which
      # `hk` then waits on for EOF forever after bats exits (a 25-min hang,
      # first CI run 34142628643).
      - name: Pre-start the pitchfork supervisor with clean fds
        run: mise exec -- pitchfork supervisor start </dev/null >/tmp/pitchfork-supervisor.log 2>&1 || true

      - name: mise run check
        env:
          CI: "true"
        run: mise run check

      # Daemon/container state that `teardown` in the bats suites removes.
      # `!success()` so it also runs on a timeout/cancel (a plain `failure()`
      # does not fire when the job is cancelled). Best-effort.
      - name: Diagnostics on non-success
        if: ${{ !success() }}
        continue-on-error: true
        run: |
          docker ps -a || true
          pitchfork list || true
          pitchfork supervisor status || true
          cat /tmp/pitchfork-supervisor.log || true

      # `mise run check` streams every hk step to this job log (interleaved
      # across parallel steps). On a FAILURE hk also writes a clean,
      # un-interleaved per-failing-step capture to $HK_STATE_DIR/output.log
      # and prints "See .../output.log" — but that file dies with the
      # runner. This keeps it (+ hk.log). `always()` so it survives a red
      # run; `if-no-files-found: ignore` because output.log is failure-only.
      # No `run:` shell here on purpose — a bare `| tee` on the check step
      # would run under the default `bash -e` (no pipefail) and MASK hk's
      # exit code.
      - name: Upload hk logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hk-check-log
          path: /tmp/hk/*.log
          if-no-files-found: ignore
          retention-days: 14

# Builds cv_frontend at a pinned commit SHA as a distroless Node image,
# pushes it to GHCR by digest, scans it, and attaches a CycloneDX SBOM as
# an OCI 1.1 referrer.
#
# The build is `docker buildx build` against deploy/frontend/Dockerfile (a
# minimal 2-stage distroless build --
# docs/adr/0007-distroless-dockerfile-not-buildpacks.md). trivy scan (zero
# suppressions -- no .trivyignore), trivy CycloneDX SBOM, and the `oras
# attach` referrer steps: buildx's own --sbom/--provenance are deliberately
# NOT used (they emit SPDX embedded in the image index, not a Referrers-API
# referrer).
#
# Manually triggered (workflow_dispatch) -- this wedge proves the pipeline
# works; it isn't webhook-driven yet (Pipelines-as-Code is the deferred
# future mechanism for that, see CLAUDE.md).
#
# Every third-party action is pinned by commit SHA, not a tag -- this
# repo's own digest-over-tag thesis applied to its own CI, not just what it
# builds (see docs/designs/digest-as-source-of-truth.md).

name: Build cv_frontend

on:
  workflow_dispatch:
    inputs:
      cv_frontend_sha:
        description: "cv_frontend commit SHA to build (a full commit SHA, not a branch or tag)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-scan-attach:
    # Native arm64 runner (docs/adr/0008-arm64-only.md): every consumer is
    # arm64, and native `npm ci` gets the right esbuild binary with no QEMU.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout toolbox (Dockerfile + mise.toml's pinned tools)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v7.0.1

      # GitHub Actions has no toLower() expression function (verified
      # against GitHub's own expressions docs) -- Docker/OCI image
      # references must be all-lowercase, but github.repository_owner
      # preserves exact case. Computed here, once, via the shell instead.
      - name: Compute lowercase image reference
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/cv-frontend" >> "$GITHUB_ENV"

      - name: Checkout cv_frontend at pinned SHA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v7.0.1
        with:
          repository: InSuperposition/cv_frontend
          ref: ${{ inputs.cv_frontend_sha }}
          path: cv_frontend

      - name: Install pinned tools (oras, trivy)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2 # see check.yml — mise-action's VERSION endpoint served a nonexistent release
          install: true
          cache: true

      - name: Cache trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # buildx builds, pushes by digest, and writes the digest to a
      # metadata file. --provenance=false --sbom=false: the SBOM referrer is
      # attached explicitly below via trivy + oras, not embedded in the
      # image index (see the workflow header).
      - name: Build and push distroless image
        run: |
          docker buildx build \
            --file deploy/frontend/Dockerfile \
            --platform linux/arm64 \
            --tag "$IMAGE:${{ inputs.cv_frontend_sha }}" \
            --provenance=false \
            --sbom=false \
            --metadata-file meta.json \
            --push \
            cv_frontend

      - name: Extract the pushed image's digest
        id: digest
        run: |
          digest=$(jq -r '.["containerimage.digest"]' meta.json)
          case "$digest" in
            sha256:*) ;;
            *) echo "no sha256 digest in meta.json" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Full scan report as JSON, attached as an OCI referrer BEFORE the
      # blocking CRITICAL gate below. A CRITICAL finding fails the job --
      # but a reject-worthy image must still carry the evidence `mise run
      # approve` reads, so this runs and attaches first. No --exit-code
      # here: this step never blocks.
      - name: Trivy scan report (JSON)
        run: |
          trivy image --format json --output scan.json \
            "$IMAGE@${{ steps.digest.outputs.digest }}"

      - name: Attach scan report as an OCI referrer
        run: |
          oras attach --artifact-type application/vnd.trivy.report+json \
            "$IMAGE@${{ steps.digest.outputs.digest }}" \
            scan.json:application/vnd.trivy.report+json

      - name: Trivy SBOM (CycloneDX)
        run: |
          trivy image --format cyclonedx --output sbom.cdx.json \
            "$IMAGE@${{ steps.digest.outputs.digest }}"

      - name: Attach SBOM as an OCI referrer
        run: |
          oras attach --artifact-type application/vnd.cyclonedx+json \
            "$IMAGE@${{ steps.digest.outputs.digest }}" \
            sbom.cdx.json:application/vnd.cyclonedx+json

      # Blocking gate, LAST. Zero suppressions -- there is no .trivyignore.
      # Runs after the evidence referrers are attached so a failed scan
      # still leaves a reviewable trail.
      - name: Trivy vulnerability scan (blocks on CRITICAL)
        run: |
          trivy image --exit-code 1 --severity CRITICAL \
            "$IMAGE@${{ steps.digest.outputs.digest }}"

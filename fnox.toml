# Repo-wide dev secret access (CLAUDE.md: fnox is a client, never a store
# of record -- OpenBao is). Entries are local bootstrap secrets held in the
# OS keychain, injected into the shell instead of a manual export.
#
# The static-seal key is NOT here: a boot-start daemon must read it before
# the login keychain unlocks, so it is a raw 0600 file next to the raft
# store ($XDG_STATE_HOME/toolbox/openbao/seal.key). Same trust level as the
# vault.db beside it. ADR 0010.

[providers.keychain]
type = "keychain"
service = "toolbox-openbao"

[secrets]
# `value` names the keychain item's account (`acct`) under the `service`
# above — fnox 1.35's keychain provider needs it to resolve the entry, and
# `mise run openbao-bootstrap`'s `fnox set` writes exactly this. Without it
# `fnox get <NAME>` returns "not found".
#
# NOTE: `fnox remove <NAME>` REWRITES this file and strips the entry +
# comments. Teardown (scripts/reset-openbao.sh) clears the keychain items
# with `security delete-generic-password` instead, so these declarations
# survive a reset.
VAULT_TOKEN = { provider = "keychain", value = "VAULT_TOKEN" }

# OpenBao recovery key (single share) — only for `operator rekey` /
# `generate-root` break-glass, which are interactive and rare, so a
# keychain item read at that moment is fine. Same custody as the rest (the
# machine is the trust boundary; the root token already lives here).
BAO_RECOVERY_KEY = { provider = "keychain", value = "recovery-key" }

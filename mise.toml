[tools]
"aqua:jdx/mise" = "2026.9.1"
"aqua:kyverno/chainsaw" = "0.2.15"
"aqua:openvex/vexctl" = "0.4.4"
"aqua:project-zot/zot" = "2.1.20"
bats = "1.14.0"
cilium-cli = "0.20.0"
cosign = "3.1.3"
crossplane = "2.5.0"
cue = "0.17.1"
flux2 = "2.9.5"
fnox = "1.35.0"
gh = "2.100.0"
hk = "1.57.0"
jq = "1.8.2"
k0sctl = "0.32.2"
kubeconform = "0.8.0"
kubectl = "1.37.0"
kyverno = "1.19.0"
openbao = "2.6.2"
opentofu = "1.12.6"
oras = "1.3.4"
pitchfork = "2.24.0"
shellcheck = "0.11.0"
tekton-cli = "0.46.0"
timoni = "0.34.0"
trivy = "0.74.0"

[tasks.openbao-bootstrap]
description = "One-time OpenBao bootstrap (init/unseal/apply/fnox) — see environments/local/README.md"
run = "./scripts/bootstrap-openbao.sh"

[tasks.openbao-reset]
description = "Wipe local OpenBao's data + stored root token together"
run = "./scripts/reset-openbao.sh"

[tasks.export-approval-pubkey]
description = "Re-export deploy/frontend/cosign-approval.pub from openbao://approval-key (run after a key rotation)"
run = "./scripts/export-approval-pubkey.sh"

[tasks.approve]
description = "Review build evidence and sign an approve/reject decision for an image digest (see deploy/frontend/README.md)"
run = "./deploy/frontend/scripts/approve.sh"

[tasks.consume]
description = "Verify a pinned approval attestation for an image digest — args: <registry/repo@sha256:...> <sha256:attestation-digest>"
run = "./deploy/frontend/scripts/verify-approval.sh"

[tools]
"aqua:ast-grep/ast-grep" = "0.45.3"
"aqua:google/go-containerregistry" = "0.22.1"   # `crane` — digest-preserving registry copy; the T7b1-followup zot seed (TODOS.md T7)
"aqua:jdx/mise" = "2026.9.1"
"aqua:kyverno/chainsaw" = "0.2.15"
"aqua:loeffel-io/ls-lint" = "2.3.1"
"aqua:openvex/vexctl" = "0.4.4"
"aqua:project-zot/zot" = "2.1.20"
bats = "1.14.0"
cilium-cli = "0.20.0"
cosign = "3.1.3"
crossplane = "2.5.0"
cue = "0.17.1"
flux2 = "2.9.5"
gh = "2.100.0"
helm = "3.21.4"   # one-time flux-operator bootstrap only (flux-bootstrap.sh); helm-controller drives it after
hk = "1.57.0"
jq = "1.8.2"
k0sctl = "0.32.2"
kubeconform = "0.8.0"
kubectl = "1.37.0"
kyverno = "1.19.0"
openbao = "2.6.2"
opentofu = "1.12.6"
oras = "1.3.4"
pitchfork = "2.24.0"
shellcheck = "0.11.0"
tekton-cli = "0.46.0"
timoni = "0.34.0"
trivy = "0.74.0"

# The local OpenBao daemon (ADR 0010): fixed loopback address; its secrets
# are 0600 files under $OPENBAO_STATE_DIR (ADR 0011 — no keychain, no fnox).
# `mise` chains [env] vars and runs a shell for `exec()`, so VAULT_TOKEN is
# injected into every `mise run` task (and the interactive shell) with no
# shell hook. A missing root.token yields an empty VAULT_TOKEN, not an error;
# `openbao-preflight.sh` turns that into a clear "run mise run local:openbao:bootstrap".
[env]
VAULT_ADDR = "http://127.0.0.1:8200"
OPENBAO_STATE_DIR = "{{ exec(command='echo \"${XDG_STATE_HOME:-$HOME/.local/state}/toolbox/openbao\"') }}"
VAULT_TOKEN = "{{ exec(command='cat \"$OPENBAO_STATE_DIR/root.token\" 2>/dev/null || true') }}"

# `mise install` is the only bootstrap step (CLAUDE.md § mise) — wire the
# hk git hooks as part of it so a fresh clone is gated without a separate
# manual `hk install`.
[hooks]
postinstall = "hk install"

[tasks.check]
description = "Run the full lint/format/test gate — identical to the hk git hooks (CLAUDE.md § hk). shellcheck, pkl, tofu fmt/validate/test, cue fmt, bats."
run = "hk check --all"

[tasks.fix]
description = "Apply the auto-fixable half of `mise run check` (formatters)."
run = "hk fix --all"

# OpenBao tasks are namespaced <environment>:<domain>:<verb> (Phase 3 of
# the repo restructure, docs/designs/repo-structure.md § mise task map).
# A future `local:bootstrap` aggregate fans out to these.
[tasks."local:openbao:bootstrap"]
description = "One-time PER-MACHINE OpenBao bootstrap (render config, register the global pitchfork daemon, init, provision Transit, write the 0600 secret files) — see environments/local/README.md"
run = "./environments/local/scripts/openbao-bootstrap.sh"

[tasks."local:openbao:start"]
description = "Start the machine-global OpenBao daemon (after a reboot, or if it was stopped). No-op if already running."
run = "pitchfork start global/openbao"

[tasks."local:openbao:stop"]
description = "Stop the machine-global OpenBao daemon (leaves it registered — `local:openbao:start` brings it back)."
run = "pitchfork stop global/openbao"

[tasks."local:openbao:reset"]
description = "Machine-wide: stop + unregister the global OpenBao daemon (waits for it to exit), wipe its raft store / config / seal.key / root.token / recovery.key / tofu state. snapshots/ (the restore bundle) is kept."
run = "./environments/local/scripts/openbao-reset.sh"

[tasks."local:openbao:snapshot"]
description = "Save a COMPLETE restore bundle (raft snapshot + seal.key + root.token) to $OPENBAO_STATE_DIR/snapshots/. Copy that whole directory off-machine for real disaster recovery."
run = "./environments/local/scripts/openbao-snapshot.sh"

[tasks."local:openbao:snapshot-restore"]
description = "Restore the local OpenBao from a snapshot bundle — args: [-force] <snapshot-file>. The bundle's seal.key + root.token must be in $OPENBAO_STATE_DIR first (see environments/local/README.md § disaster). Use -force into a freshly bootstrapped instance."
run = "bao operator raft snapshot restore"

# T7c Increment 4 — the in-cluster OpenBao move (environments/local/openbao-
# cluster/, docs/adr/0016). 4a is the pinned helm_release + its chart-pin
# gate; the bootstrap bridge (local:openbao-cluster:bootstrap) lands in 4b.
[tasks."local:openbao-cluster:helm-verify"]
description = "Assert environments/local/openbao-cluster/openbao-cluster.lock's chart_digest matches the pinned tag (the OpenTofu helm provider cannot pin a digest), then render the chart by digest and check the Increment 4a shape. Self-skips offline."
run = "./environments/local/scripts/openbao-cluster-verify.sh"

[tasks."local:openbao-cluster:bootstrap"]
description = "One-time per cluster (disaster-recovery re-run safe): move the local OpenBao into the OrbStack cluster — snapshot the host, create ns + seal Secret, tofu apply the helm_release, first `bao operator init`, key-preserving `raft snapshot restore -force`, hard-assert approval-key unchanged. Needs the host daemon up + Flux bootstrapped. Phase C (transit/keys/sops, k8s-auth) is Increment 4c."
run = "./environments/local/scripts/openbao-cluster-bootstrap.sh"

# The attestation sign/verify seam is its own concern (docs/designs/repo-
# structure.md, ADR 0013) — tasks namespaced attestation:<verb>.
[tasks."attestation:export-pubkey"]
description = "Re-export attestation/cosign-approval.pub from openbao://approval-key, then `git add` + commit it (run after a Transit key rotation). Needs OpenBao up."
run = "cosign public-key --key openbao://approval-key --outfile attestation/cosign-approval.pub"

[tasks."attestation:sign"]
description = "Review build evidence and sign an approve/reject decision for an image digest (see attestation/README.md)"
run = "./attestation/scripts/attestation-sign.sh"

[tasks."attestation:verify"]
description = "Verify a pinned approval attestation, no deploy — args: <registry/repo@sha256:...> <sha256:attestation-digest>"
run = "./attestation/scripts/attestation-verify.sh"

# The frontend image consumer (docs/designs/repo-structure.md § mise task map).
[tasks."frontend:deploy"]
description = "Verify a pinned approval attestation and deploy that image to the local pitchfork frontend daemon — args: <registry/repo@sha256:...> <sha256:attestation-digest>"
run = "./deploy/frontend/scripts/frontend-deploy.sh"

# T7b1-followup: mirror the digest-pinned base + `# syntax=` images from
# deploy/frontend/Dockerfile into the local zot, so the in-cluster build never
# reaches docker.io / gcr.io (the OrbStack IPv6-egress defect — TODOS.md T7,
# /investigate 2026-09-08). Runs on the host, where IPv4 works. Idempotent.
[tasks."frontend:seed"]
description = "Seed the local zot with cv_frontend's digest-pinned base images so the in-cluster build is hermetic (TODOS.md T7b1-followup) — arg: [zot-registry] (default localhost:30500)."
run = "./ci/scripts/registry-seed.sh deploy/frontend/Dockerfile"

# T7b3 — the operator entrypoint for the in-cluster build/scan/gate pipeline.
# Renders deploy/frontend/pipelinerun.cue (plain CUE, not a Timoni module —
# plan D1), `kubectl create`s the PipelineRun, watches it to a terminal
# state, and on success hands over the resolved digest + the exact
# `attestation:sign` line. Preflights context / Pipeline+gate / buildkitd
# mirror CM / zot / base images first.
[tasks."frontend:build"]
description = "Build + scan + gate cv_frontend in-cluster from a commit SHA, then print the digest and the attestation:sign line — arg: <cv_frontend-sha>."
run = "./deploy/frontend/scripts/frontend-build.sh"

# Platform install — environments/local/ owns vendored-upstream installs (same
# split as OpenBao), NOT ci/. The Tekton *controller* stays on this script
# through T7c (Flux cannot install an absent Tekton — it is a named
# prerequisite for the T7c `ci-runtime` Flux Kustomization). The script
# downloads the pinned release.yaml, verifies its SHA-256 against
# environments/local/tekton/release.lock, then applies the verified local
# file — never `kubectl apply -f <url>` (ADR 0001). Details:
# environments/local/README.md § Tekton.
[tasks."local:tekton:install"]
description = "Checksum-verify + install the pinned Tekton Pipelines controller on orb k8s (a Flux prerequisite — Flux cannot install an absent Tekton)."
run = "./environments/local/scripts/tekton-install.sh"

[tasks."local:tekton:wait"]
description = "Block until the Tekton Pipelines control plane (controller + webhook) is Available — the T7c ci-runtime Flux Kustomization and any PipelineRun admission assume Tekton is up."
run = "kubectl --context orbstack -n tekton-pipelines wait --for=condition=Available deploy/tekton-pipelines-controller deploy/tekton-pipelines-webhook --timeout=120s"

# Flux — the one-time imperative bridge, then declarative. `local:flux:bootstrap`
# runs ONCE per cluster: cosign-verify the pinned flux-operator chart digest,
# `helm upgrade --install` it, apply the FluxInstance. After that the committed
# environments/local/flux/ (FluxInstance + operator HelmRelease + the zot
# Kustomization) is reconciled from git — no more shell. Details:
# environments/local/README.md § Flux.
[tasks."local:flux:bootstrap"]
description = "One-time per cluster: verify + install flux-operator and apply the FluxInstance. Idempotent (disaster-recovery re-run safe)."
run = "./environments/local/scripts/flux-bootstrap.sh"

[tasks."local:flux:status"]
description = "Show the FluxInstance + every Flux source/Kustomization/HelmRelease and its Ready condition."
run = "flux --context orbstack get all --all-namespaces"

# Interim local registry — TODOS.md T7b0. Committed manifests (zot ships no
# all-in-one release), pinned by image digest. The INSTALL is now a Flux
# Kustomization (environments/local/flux/zot-sync.yaml) reconciled from git —
# `local:zot:install` / `:uninstall` are retired. `local:zot:wait` stays
# (frontend-build.sh calls it before a pipeline run). Details:
# environments/local/README.md § zot.
[tasks."local:zot:wait"]
description = "Block until the local zot Deployment is Available (frontend-build.sh calls this before a pipeline run)."
run = "kubectl --context orbstack -n zot wait --for=condition=Available deploy/zot --timeout=90s"

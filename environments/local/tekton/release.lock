# Tekton Pipelines — pinned interim install.
#
# Hand-maintained (NOT generated). `environments/local/scripts/tekton-install.sh`
# downloads `<base-url>/<version>/release.yaml`, verifies its SHA-256 against
# `sha256` below, and only then `kubectl apply`s the verified local file — the
# repo's thesis is that the digest/checksum IS the trust boundary (ADR 0001),
# so `kubectl apply -f <url>` is never used.
#
# Retired in T7c when Flux reconciles `environments/local/tekton/` from a
# digest-pinned OCIRepository (README § Tekton, TODOS.md T7c, ADR 0014).
#
# To re-pin on a Tekton bump:
#   curl -sSfL https://storage.googleapis.com/tekton-releases/pipeline/previous/<v>/release.yaml | shasum -a 256
# then update both lines. (The GCS path uses the pipeline COMPONENT version,
# not the GitHub release-train tag.)

version=v1.6.0

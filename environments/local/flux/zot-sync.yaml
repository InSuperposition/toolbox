# Flux Kustomization — reconciles the interim local zot registry
# (environments/local/zot/) from the flux-system GitRepository.
#
# Replaces `mise run local:zot:install` (deleted this increment). The zot
# Namespace + `zot-data` PVC carry `kustomize.toolkit.fluxcd.io/prune: disabled`
# so ongoing reconciliation never garbage-collects the stored images, and
# `deletionPolicy: Orphan` means deleting THIS Kustomization leaves zot
# running (a deliberate teardown is a manual `kubectl delete`, never a
# side effect of a git edit).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zot
  namespace: flux-system
spec:
  interval: "10m"
  retryInterval: "1m"
  timeout: "5m"
  prune: true
  deletionPolicy: "Orphan"
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./environments/local/zot"
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: zot
      namespace: zot

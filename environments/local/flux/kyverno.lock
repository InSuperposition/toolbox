# Kyverno — pinned. Admission-time verification of the cv_frontend approval
# attestation on the local dev *reference* cluster (Plan B K1, docs/adr/0020).
#
# Hand-maintained (NOT generated). The digest IS the trust boundary
# (ADR 0001) — a tag is never the pin.
#
# SIGNATURE: the Kyverno *chart* is NOT cosign-signed (verified at authoring,
# 2026-09-10: `cosign tree ghcr.io/kyverno/charts/kyverno:3.9.1` → "No Supply
# Chain Security Related Artifacts found"; keyless `cosign verify` → "no
# signatures found"). So — exactly as with the OpenBao and cert-manager
# charts — there is NO `spec.verify` block; the committed `chart_digest`
# below is the whole pin. The OCIRepository in `kyverno-helmrelease.yaml`
# sets `ref.digest` (content addressed, immutable); the six component
# images (five controllers + readiness-checker) + the CRD-lifecycle CLI
# image are digest-pinned via chart values.
#
# The Kyverno component *images* ARE keyless-signed (Fulcio); we do not add a
# runtime image `spec.verify` — a digest pinned in git, reviewed in the PR,
# is the trust input (same rationale as cert-manager.lock decision d8e2b203).
#
# K1 BUILD-TIME SPIKE (2026-09-10): v1.19.1 was live-proven semantically
# equivalent to `attestation-verify.sh` for the four ADR-0006 cases (approved
# admit; signed-rejection / wrong-subject / malformed / no-attestation all
# deny, fail-closed). kyverno#16435 (SIGSEGV on keyed cosign verify of
# new-bundle OCI-referrer attestations) is fixed since v1.19.0 (PR #16298);
# zero crashes observed across the spike.
#
# To bump Kyverno:
#   1. pick chart version V (chart repo versions independently of appVersion)
#   2. helm show chart oci://ghcr.io/kyverno/charts/kyverno --version V   -> confirm appVersion A
#   3. crane digest ghcr.io/kyverno/charts/kyverno:V                      -> chart_digest
#   4. cosign tree ghcr.io/kyverno/charts/kyverno:V                       -> re-confirm still unsigned
#   5. for each component: crane digest ghcr.io/kyverno/<repo>:A          -> *_image_digest
#      crane digest ghcr.io/kyverno/kyverno-cli:A                         -> cli_image_digest
#   6. update every line below + kyverno-helmrelease.yaml
#   7. re-run the T6 semantic-equivalence spike on the new version


# Flux Kustomization — reconciles the dev PKI (environments/local/cert-manager/:
# the selfSigned root, the CA, the CA ClusterIssuer, the openbao-tls leaf)
# from the flux-system GitRepository.
#
# A SEPARATE Kustomization, not part of flux-system's inventory, for the
# same reason zot-sync.yaml / ci-runtime.yaml are separate: these are
# cert-manager.io/v1 custom kinds. kustomize-controller server-side-dry-runs
# a Kustomization's entire resource set and rejects the whole apply if ONE
# object's CRD is unknown — so with the Issuer CRs in flux-system, a fresh
# cluster deadlocks: the cert-manager HelmRelease (which installs those
# CRDs) is in the same Kustomization and never applies. Here the "no matches
# for kind ClusterIssuer" failure is isolated and retried until the
# HelmRelease (still in flux-system — HelmRelease + OCIRepository are
# always-known kinds) lands the CRDs.
#
# healthChecks assert cert-manager is actually usable before this
# Kustomization reports Ready. deletionPolicy Orphan: deleting this CR must
# not garbage-collect the CA (every issued cert would break) — a deliberate
# teardown is a manual `kubectl delete -k environments/local/cert-manager`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-pki
  namespace: flux-system
spec:
  interval: "10m"
  retryInterval: "30s"
  timeout: "5m"
  prune: true
  deletionPolicy: "Orphan"
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./environments/local/cert-manager"
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-webhook
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-cainjector
      namespace: cert-manager

# Dev PKI foundation for the in-cluster OpenBao TLS listener (T7c Increment
# 4a).
#
# Chain: a selfSigned root ClusterIssuer -> a CA Certificate (its key
# generated IN-CLUSTER, never in repo or tofu state) -> a CA ClusterIssuer.
# The selfSigned root is the acknowledged DEV limitation; PRODUCTION swaps
# it for a real backend (ACME / an org intermediate CA / an OpenBao PKI
# engine) and the CA ClusterIssuer + every leaf stay unchanged, only the
# root moves (cert-manager.lock § DEV vs PROD).
#
# The `openbao-tls` leaf Certificate is NOT here — it lands in Increment 4b
# alongside namespace `openbao` and the seal Secret (the bridge owns the
# namespace — the acyclic anchor, plan § B1 — so a Flux-reconciled resource
# in a namespace that does not exist yet would leave the flux-system
# Kustomization perpetually NotReady). 4a ships only the CA that will issue
# it.
#
# Reconciled by kustomize-controller as part of the flux-system
# Kustomization. These CRs fail their first reconcile until cert-manager's
# HelmRelease has installed the CRDs, then Flux retries to convergence — the
# same eventual-consistency shape flux-operator's own CRDs + HelmRelease
# use.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: toolbox-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: toolbox-dev-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: toolbox-dev-ca
  secretName: toolbox-dev-ca
  duration: 87600h # 10y — a dev root; rotation is a cluster rebuild
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: toolbox-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: toolbox-dev-ca
spec:
  ca:
    secretName: toolbox-dev-ca # lives in the cluster-resource namespace (cert-manager)

# cert-manager — pinned. In-cluster PKI for the local dev cluster (T7c
# Increment 4a, docs/adr/0016). Issues the TLS server cert for the
# in-cluster OpenBao listener (environments/local/openbao-cluster/).
#
# Hand-maintained (NOT generated). The digest IS the trust boundary
# (ADR 0001).
#
# SIGNATURE: cert-manager charts + images are signed with a STATIC cosign
# key (NOT keyless / Fulcio — `cosign verify` keyless returns "no matching
# signatures: empty key"). Verified ONCE at authoring, 2026-09-09:
#
#   curl -sSL -o cm.pem https://cert-manager.io/public-keys/cert-manager-pubkey-2021-09-20.pem
#   cosign verify --key cm.pem --insecure-ignore-tlog \
#     quay.io/jetstack/charts/cert-manager@sha256:15c0b46d…   -> Verified OK
#
# The committed `chart_digest` below is the whole runtime pin — the
# OCIRepository in cert-manager-helmrelease.yaml pins `ref.digest` (content
# addressed, immutable) with NO `spec.verify` block. A runtime static-key
# `verify.secretRef` would add a committed third-party key + a Secret + key
# rotation surface and buys nothing over an immutable digest (decision
# d8e2b203, 2026-09-09). This matches how the OpenBao chart is pinned.
#
# DEV vs PROD: the selfSigned root -> CA -> leaf chain in
# cert-manager-pki.yaml is the acknowledged dev limitation. Production
# points the leaf's `issuerRef` at a real backend (ACME, an org
# intermediate CA, or an OpenBao PKI engine) — the `Certificate` and every
# consumer stay unchanged, only `issuerRef` moves.
#
# To bump:
#   1. pick version V (e.g. v1.21.2)
#   2. crane digest quay.io/jetstack/charts/cert-manager:V              -> chart_digest
#   3. crane digest quay.io/jetstack/cert-manager-controller:V          -> controller_image_digest
#   4. …-webhook:V / …-cainjector:V / …-startupapicheck:V               -> the other three
#   5. cosign verify --key <the pem above> --insecure-ignore-tlog quay.io/jetstack/charts/cert-manager@<chart_digest>
#   6. update every line below + cert-manager-helmrelease.yaml

version=v1.21.1

# [k8s]-gated (environments/local/scripts/openbao-cluster-chainsaw.sh skips
# without an orbstack cluster, and skips until openbao-cluster-bootstrap.sh
# has run once — probe: the `openbao` StatefulSet).
#
# Asserts the RUNNING post-migration state (T7c Increments 4b + 4c) — it
# does NOT run the bridge or tear anything down. The full migration, the
# approval-key-preserved proof, and the in-OpenBao Phase-C state (the sops
# key exists, the k8s-auth role denies signing) are the bridge's own hard
# assertions (`tofu apply` fails if the API calls fail), `tofu output`, and
# the documented `mise run local:openbao-cluster:bootstrap` acceptance run.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: openbao-cluster-reconcile
spec:
  steps:
    - name: cert-manager-issued-the-tls-secret
      try:
        - assert:
            resource:
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: openbao-tls
                namespace: openbao
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: openbao-tls
                namespace: openbao
              type: kubernetes.io/tls

    - name: seal-secret-is-present
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: openbao-seal
                namespace: openbao

    - name: statefulset-is-a-single-ready-raft-voter
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: openbao
                namespace: openbao
              spec:
                replicas: 1
              status:
                readyReplicas: 1

    - name: pod-is-running-and-unsealed
      try:
        # readinessProbe is `bao status` (exit 0 only when unsealed), so a
        # Ready pod == an unsealed OpenBao.
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: openbao-0
                namespace: openbao
              status:
                phase: Running
                (conditions[?type == 'Ready'] | [0].status): "True"

    - name: the-https-service-exists
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: openbao
                namespace: openbao
              spec:
                (ports[?name == 'https'] | [0].port): 8200

    - name: auth-delegator-binding-for-k8s-auth
      try:
        # the chart ships this (server.authDelegator.enabled default true);
        # the Phase-C k8s-ServiceAccount auth method's TokenReview calls fail
        # without it.
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: openbao-server-binding
              roleRef:
                kind: ClusterRole
                name: system:auth-delegator
              (subjects[?kind == 'ServiceAccount'] | [0].namespace): openbao

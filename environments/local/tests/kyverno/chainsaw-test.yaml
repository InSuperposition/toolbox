# [k8s]-gated (environments/local/scripts/kyverno-chainsaw.sh skips without
# an orbstack cluster whose `frontend-approval` ImageValidatingPolicy has
# reconciled). Server-side checks the static kubeconform-kyverno gate cannot
# do: the Flux-reconciled policy actually gates a real cv_frontend pod both
# ways.
#
# Asserts the RUNNING state — it does not install Kyverno or tear anything
# down beyond the pods it creates. The deny variants (signed rejection,
# wrong subject, malformed predicate) are covered by the K1 T6 build-time
# spike (docs/adr/0020) + attestation-verify.bats; this only exercises the
# admit path and the common unsigned-image deny.
#
# Fixtures are REAL, on the in-cluster zot (T7c R2 — repointed from GHCR):
#   - approved: cv-frontend@sha256:fc86908bbe... carries a real approval
#     attestation signed by openbao://approval-key (annotated referrer).
#     This is the PLATFORM digest, not the index the tag resolves to —
#     confirmed live, `/investigate` 2026-09-15: Kyverno's
#     ImageValidatingPolicy has no platform-selection config and denies
#     every index reference with "no child with platform linux/amd64"
#     (BuildKit's `attest:provenance` opt, T8, makes every real push a
#     multi-manifest index). `attestation-sign.sh` now resolves+signs
#     this platform digest itself (`oras resolve --platform=linux/arm64`)
#     — never hand-pin the index digest here again.
#     Re-pinned 2026-09-15 (P3 TODOS.md item, then again for this fix) —
#     the prior digest (sha256:d0c92cb1...) had been evicted from zot
#     (404, unclear when); this is a re-approval of the same cv_frontend
#     revision (db174d91), rebuilt fresh, mirroring
#     deploy/frontend/timoni.lock's `image_ref` re-pin.
#   - unsigned: cv-frontend@sha256:dc2d74b2... (a busybox stand-in pushed
#     with no attestation — the deny path only cares that no referrer verifies)
# Regenerate the approved one after an approval-key rotation, or if it
# vanishes from zot again — attestation-sign.sh prints the PLATFORM
# digest to use here, not the index digest you pass it:
#   mise run attestation:sign -- zot.zot.svc.cluster.local:5000/cv-frontend@<INDEX-digest>
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kyverno-reconcile
spec:
  # Kyverno's admission verification pulls the image + its referrers from
  # the in-cluster zot and runs cosign verify — well over chainsaw's default
  # operation timeout on a cold pull.
  timeouts:
    apply: 90s
    assert: 90s
    error: 90s
  # the policy's namespaceSelector is `toolbox.dev/cv-frontend: approval-enforced`
  namespaceTemplate:
    metadata:
      labels:
        toolbox.dev/cv-frontend: approval-enforced
  steps:
    - name: policy-is-ready
      try:
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ImageValidatingPolicy
              metadata:
                name: frontend-approval
              status:
                (conditionStatus.ready): true

    - name: an-approved-cv-frontend-pod-is-admitted
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: cv-frontend-approved
              spec:
                restartPolicy: Never
                containers:
                  - name: c
                    image: zot.zot.svc.cluster.local:5000/cv-frontend@sha256:fc86908bbe750888b0bd79542012b7489077cd81fa4aeb9149f57007c99821f2
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: cv-frontend-approved
              spec:
                # the digest was NOT mutated (mutateDigest: false) and the
                # pod exists == admission passed
                (containers[0].image): zot.zot.svc.cluster.local:5000/cv-frontend@sha256:fc86908bbe750888b0bd79542012b7489077cd81fa4aeb9149f57007c99821f2

    - name: an-unsigned-cv-frontend-pod-is-denied
      try:
        - create:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: cv-frontend-unsigned
              spec:
                restartPolicy: Never
                containers:
                  - name: c
                    image: zot.zot.svc.cluster.local:5000/cv-frontend@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'frontend-approval')): true
                  (contains($error, 'no valid approval attestation')): true

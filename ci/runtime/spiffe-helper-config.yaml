# The `spiffe-helper` config the `fetch-svid` step loads via `-config`.
# `daemon_mode = false` — fetch once and exit — is correct for a Tekton
# step: TaskRun steps run sequentially in one pod lifetime, well under a
# fresh SVID's default TTL, so no rotation/signal-reload machinery is
# needed the way a long-running service would need it.
#
# INTERIM + LOCAL-SPECIFIC, same posture as buildkitd-mirror.yaml:
# `agent_address` is this dev cluster's spire-agent Workload API socket
# (`environments/local/spire/`, mounted into the step via a hostPath
# volume — the `spiffe-csi-driver` isn't enabled yet). A
# production pipeline would bind its own config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-config
  namespace: ci
  labels:
    app.kubernetes.io/part-of: toolbox-ci
data:
  helper.hcl: |
    # https://github.com/spiffe/spiffe-helper#configuration
    agent_address = "/run/spire/agent-sockets/spire-agent.sock"
    cert_dir = "/svid-certs"
    svid_file_name = "svid.pem"
    svid_key_file_name = "svid_key.pem"
    svid_bundle_file_name = "svid_bundle.pem"
    daemon_mode = false

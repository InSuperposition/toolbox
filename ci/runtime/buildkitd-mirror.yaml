# The `buildkitd.toml` the build Task loads via `--config`. It mirrors
# docker.io + gcr.io to the local zot so the in-cluster BuildKit build never
# reaches an external registry — this OrbStack cluster's pods have a
# working IPv6 stack + AAAA DNS but no routable v6 egress, so external
# registry fetches fail ~50% of the time. `mise run frontend:seed`
# populates zot from the host first.
#
# The zot entry's `ca` path (`/ca/ca-certificates.crt`) is
# NOT baked into this ConfigMap — it's the `ca-bundle` workspace, bound by
# the PipelineRun to the trust-manager `toolbox-ca-bundle` ConfigMap
# (already reconciled into ns `ci`) so a CA rotation flows through
# without touching this file.
#
# The zot entry's `keypair` IS baked in here, unlike `ca` above — the path
# is a build-time constant (the `fetch-svid` step in buildkit-build.yaml
# always writes to this same emptyDir mount), not something that rotates
# independently of a Task/ConfigMap change the way the CA does. zot now
# requires this cert to push (mTLS enforced).
#
# INTERIM + LOCAL-SPECIFIC. The mirror target (`zot.zot.svc.cluster.local:5000`)
# is this dev cluster's zot; a production pipeline binds its own ConfigMap to
# the build Task's `buildkitd-config` workspace. Once Cilium's networking
# module lands with a v4-only datapath, the mirror becomes an optimization
# rather than a correctness requirement.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-mirror
  namespace: ci
  labels:
    app.kubernetes.io/part-of: toolbox-ci
data:
  buildkitd.toml: |
    # https://github.com/moby/buildkit/blob/master/docs/buildkitd.toml.md
    [registry."docker.io"]
      mirrors = ["zot.zot.svc.cluster.local:5000"]
    [registry."gcr.io"]
      mirrors = ["zot.zot.svc.cluster.local:5000"]
    [registry."zot.zot.svc.cluster.local:5000"]
      ca = ["/ca/ca-certificates.crt"]
      [[registry."zot.zot.svc.cluster.local:5000".keypair]]
        key = "/svid-certs/svid_key.pem"
        cert = "/svid-certs/svid.pem"

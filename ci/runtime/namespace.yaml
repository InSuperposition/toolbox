# The `ci` namespace — nothing else lives here.
#
# No Role/RoleBinding on purpose: the build step reads a *mounted* Secret,
# never the k8s API, so its ServiceAccount needs no verbs. No TaskRun in
# this pipeline sets `automountServiceAccountToken: false` anywhere —
# every Task except `provenance-sign`
# (`ci/runtime/provenance-signer-sa.yaml`) simply runs as the namespace's
# default ServiceAccount with default automount, and none of them touch
# the k8s API regardless. Granting taskrun-create to any build SA would be
# an indirect workload-creation path that could sidestep the
# securityContext posture `ci/tasks/buildkit-build.yaml` pins — that's the
# real reason there's no RBAC here, not the token-mount setting.
#
# Pod Security Admission: `privileged` is set explicitly, not inherited.
# Rootless BuildKit needs seccomp Unconfined + SETUID/SETGID +
# allowPrivilegeEscalation (ci/README.md § Residual privilege surface) —
# `baseline` would reject the build pod. The real scoping mechanism is a
# Kyverno policy targeting this namespace (a Kyverno-module concern),
# not PSA. Blast radius today is the single-user OrbStack VM.
apiVersion: v1
kind: Namespace
metadata:
  name: ci
  labels:
    app.kubernetes.io/part-of: toolbox-ci
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

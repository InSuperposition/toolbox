# T8 — build provenance (TODOS.md). The ServiceAccount the provenance-sign
# Task's pod runs as — bound by `deploy/frontend/pipelinerun.cue`'s
# taskRunSpecs override to just that one PipelineTask, never the whole
# PipelineRun. No RBAC (no Role/RoleBinding) — this SA's only job is being
# a bindable identity for OpenBao's k8s-auth method
# (`environments/local/openbao/main.tf`'s `chains_provenance` role, bound
# by name only — a cross-concern reference, not a file edge, ADR 0012/0013).
# It never touches the k8s API.
#
# automountServiceAccountToken stays the k8s default (true, unset here) —
# the pod needs its own projected token to authenticate to OpenBao's
# kubernetes auth method (`auth/kubernetes/login`). Every OTHER Task in this
# pipeline runs as the namespace's default ServiceAccount instead (no
# OpenBao access needed, no token to project) — this is a new, narrowly-
# scoped identity for exactly one Task, not a namespace-wide change.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provenance-signer
  namespace: ci
  labels:
    app.kubernetes.io/part-of: toolbox-ci

# The in-cluster build pipeline:
#   clone-app -> clone-defs -> build -> scan-attach -> provenance-sign -> gate.
# `gate` (ci/tasks/gate.yaml) runs last and fails the run on a CRITICAL
# finding, reading the same scan.json scan-attach attached as evidence.
# `provenance-sign` runs sequentially after `scan-attach`, not in parallel
# with it — both would write to the same `shared` PVC from separate pods;
# sequential avoids a concurrent-mount question this repo hasn't needed to
# answer yet, at the cost of one extra step's latency on a single-node dev
# cluster. It sits BEFORE `gate` (like `scan-attach`) — evidence is attached
# regardless of the scan verdict, same reasoning as scan-attach's own
# comment below.
#
# Consumer-agnostic: every concrete value is a param. The per-consumer
# PipelineRun that binds cv_frontend's repo URLs + SHAs + image ref lives
# in deploy/<consumer>/, rendered from plain CUE
# (`deploy/frontend/pipelinerun.cue` — not a Timoni module). Human approval
# (`attestation-sign.sh`) and consumption (`frontend-deploy.sh`) stay
# OUTSIDE this pipeline.
#
# Workspace `shared` is backed by a per-run `volumeClaimTemplate` in the
# PipelineRun — Tekton `coschedule: workspaces` forbids a TaskRun binding
# two distinct PVCs, so the clones and the build share ONE claim and
# address their trees by sub-directory / subPath. Workspace
# `buildkitd-config` is a ConfigMap (not a PVC — no coschedule constraint);
# the PipelineRun binds it to `ci/runtime/buildkitd-mirror.yaml` so the
# build talks only to the in-cluster zot, working around an OrbStack
# IPv6-egress defect. Workspace `ca-bundle` is the trust-manager
# `toolbox-ca-bundle` ConfigMap (already reconciled into ns `ci`) — the dev
# CA for zot's HTTPS listener, shared by `build` and `scan-attach` rather
# than a second committed copy.
#
# `retries: 2` on the clone tasks: the same OrbStack cluster intermittently
# fails DNS on an external host (`git`'s resolver, ~10% — an OrbStack DNS
# proxy timeout, distinct from the IPv6 mode the `disable-ipv6` step and the
# build mirror handle). A retry clears it; the build has no external egress
# left to retry.
#
# The build digest IS a Pipeline result, `IMAGE_DIGEST`, captured once by
# `build` at push time (see ci/tasks/buildkit-build.yaml's header for how).
# `scan-attach`/`provenance-sign` address the image by this digest, never
# a re-resolved `$(APP_REVISION)` tag — closes a real correctness gap
# where a concurrent/rerun PipelineRun could attach evidence to, or sign
# provenance for, the wrong image. `frontend-build.sh` reads this same
# Pipeline result instead of its own post-hoc `oras resolve` — one source
# of truth for the digest that gets shown to the operator and the digest
# evidence was actually attached to.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-scan-approve
  labels:
    app.kubernetes.io/part-of: toolbox-ci
spec:
  description: >-
    Clone an app + the toolbox Dockerfile at pinned revisions, build and
    push a SHA-tagged image with daemonless rootless BuildKit, scan it with
    trivy and attach the JSON report + CycloneDX SBOM as OCI referrers, then
    fail the run on a CRITICAL finding (the `gate` task).
  params:
    - name: IMAGE
      type: string
      description: Target repo ref, no tag (e.g. zot.zot.svc.cluster.local:5000/cv-frontend).
    - name: APP_REPO_URL
      type: string
      description: Public HTTPS git URL of the app (the build context).
    - name: APP_REVISION
      type: string
      description: App commit SHA — also the push tag.
    - name: DEFS_REPO_URL
      type: string
      description: Public HTTPS git URL of the repo holding the Dockerfile (toolbox).
    - name: DEFS_REVISION
      type: string
      description: Dockerfile-repo commit SHA.
    - name: DOCKERFILE_DIR
      type: string
      default: "."
      description: >-
        Dockerfile directory relative to the defs checkout root
        (e.g. deploy/frontend — the build Task subPaths build-defs to defs/).
    - name: REGISTRY_INSECURE
      type: string
      default: "false"
  workspaces:
    - name: shared
    - name: buildkitd-config
    - name: ca-bundle
  results:
    - name: IMAGE_DIGEST
      description: >-
        The pushed image's INDEX digest, captured once by `build` at push
        time — the operator reads this instead of a post-hoc `oras resolve`.
      value: $(tasks.build.results.IMAGE_DIGEST)
  tasks:
    - name: clone-app
      retries: 2
      taskRef:
        name: git-clone
      params:
        - { name: URL, value: $(params.APP_REPO_URL) }
        - { name: REVISION, value: $(params.APP_REVISION) }
        - { name: SUBDIR, value: app }
      workspaces:
        - { name: output, workspace: shared }
    - name: clone-defs
      runAfter: [clone-app]
      retries: 2
      taskRef:
        name: git-clone
      params:
        - { name: URL, value: $(params.DEFS_REPO_URL) }
        - { name: REVISION, value: $(params.DEFS_REVISION) }
        - { name: SUBDIR, value: defs }
      workspaces:
        - { name: output, workspace: shared }
    - name: build
      runAfter: [clone-defs]
      taskRef:
        name: buildkit-build
      params:
        - { name: IMAGE, value: $(params.IMAGE) }
        - { name: APP_REVISION, value: $(params.APP_REVISION) }
        - { name: APP_REPO_URL, value: $(params.APP_REPO_URL) }
        - { name: DOCKERFILE_DIR, value: $(params.DOCKERFILE_DIR) }
        - { name: REGISTRY_INSECURE, value: $(params.REGISTRY_INSECURE) }
      workspaces:
        - { name: source, workspace: shared, subPath: app }
        - { name: build-defs, workspace: shared, subPath: defs }
        - { name: buildkitd-config, workspace: buildkitd-config }
        - { name: ca-bundle, workspace: ca-bundle }
    - name: scan-attach
      runAfter: [build]
      taskRef:
        name: scan-attach
      params:
        - { name: IMAGE, value: $(params.IMAGE) }
        - { name: DIGEST, value: $(tasks.build.results.IMAGE_DIGEST) }
        - { name: REGISTRY_INSECURE, value: $(params.REGISTRY_INSECURE) }
      workspaces:
        - { name: shared, workspace: shared }
        - { name: ca-bundle, workspace: ca-bundle }
    - name: provenance-sign
      runAfter: [scan-attach]
      taskRef:
        name: provenance-sign
      params:
        - { name: IMAGE, value: $(params.IMAGE) }
        - { name: DIGEST, value: $(tasks.build.results.IMAGE_DIGEST) }
        - { name: REGISTRY_INSECURE, value: $(params.REGISTRY_INSECURE) }
      workspaces:
        - { name: shared, workspace: shared }
        - { name: ca-bundle, workspace: ca-bundle }
    - name: gate
      runAfter: [provenance-sign]
      taskRef:
        name: gate
      workspaces:
        - { name: shared, workspace: shared }

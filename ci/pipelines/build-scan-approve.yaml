# T7b1/T7b2/T7b3 — the in-cluster build pipeline:
#   clone-app -> clone-defs -> build -> scan-attach -> gate.
# `gate` (ci/tasks/gate.yaml) runs last and fails the run on a CRITICAL
# finding, reading the same scan.json scan-attach attached as evidence.
#
# Consumer-agnostic (ADR 0014, rules/boundary-ci.yml): every concrete value
# is a param. The per-consumer PipelineRun that binds cv_frontend's repo
# URLs + SHAs + image ref lives in deploy/<consumer>/, rendered from plain
# CUE (`deploy/frontend/pipelinerun.cue`, T7b3 — not a Timoni module).
# Human approval (`attestation-sign.sh`) and consumption
# (`frontend-deploy.sh`) stay OUTSIDE this pipeline.
#
# Workspace `shared` is backed by a per-run `volumeClaimTemplate` in the
# PipelineRun (ci/README.md § Workspaces — Tekton `coschedule: workspaces`
# forbids a TaskRun binding two distinct PVCs, so the clones and the build
# share ONE claim and address their trees by sub-directory / subPath).
# Workspace `buildkitd-config` is a ConfigMap (not a PVC — no coschedule
# constraint); the PipelineRun binds it to `ci/runtime/buildkitd-mirror.yaml`
# so the build talks only to the in-cluster zot (TODOS.md T7b1-followup —
# the OrbStack IPv6-egress defect).
#
# `retries: 2` on the clone tasks: the same OrbStack cluster intermittently
# fails DNS on an external host (`git`'s resolver, ~10% — an OrbStack DNS
# proxy timeout, distinct from the IPv6 mode the `disable-ipv6` step and the
# build mirror handle). A retry clears it; the build has no external egress
# left to retry.
#
# The build digest is never a Pipeline result — see
# ci/tasks/buildkit-build.yaml. The operator runs
# `oras resolve $(IMAGE):$(APP_REVISION)` after a green run.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-scan-approve
  labels:
    app.kubernetes.io/part-of: toolbox-ci
spec:
  description: >-
    Clone an app + the toolbox Dockerfile at pinned revisions, build and
    push a SHA-tagged image with daemonless rootless BuildKit, scan it with
    trivy and attach the JSON report + CycloneDX SBOM as OCI referrers, then
    fail the run on a CRITICAL finding (the `gate` task).
  params:
    - name: IMAGE
      type: string
      description: Target repo ref, no tag (e.g. zot.zot.svc.cluster.local:5000/cv-frontend).
    - name: APP_REPO_URL
      type: string
      description: Public HTTPS git URL of the app (the build context).
    - name: APP_REVISION
      type: string
      description: App commit SHA — also the push tag.
    - name: DEFS_REPO_URL
      type: string
      description: Public HTTPS git URL of the repo holding the Dockerfile (toolbox).
    - name: DEFS_REVISION
      type: string
      description: Dockerfile-repo commit SHA.
    - name: DOCKERFILE_DIR
      type: string
      default: "."
      description: >-
        Dockerfile directory relative to the defs checkout root
        (e.g. deploy/frontend — the build Task subPaths build-defs to defs/).
    - name: REGISTRY_INSECURE
      type: string
      default: "true"
  workspaces:
    - name: shared
    - name: buildkitd-config
  tasks:
    - name: clone-app
      retries: 2
      taskRef:
        name: git-clone
      params:
        - { name: URL, value: $(params.APP_REPO_URL) }
        - { name: REVISION, value: $(params.APP_REVISION) }
        - { name: SUBDIR, value: app }
      workspaces:
        - { name: output, workspace: shared }
    - name: clone-defs
      runAfter: [clone-app]
      retries: 2
      taskRef:
        name: git-clone
      params:
        - { name: URL, value: $(params.DEFS_REPO_URL) }
        - { name: REVISION, value: $(params.DEFS_REVISION) }
        - { name: SUBDIR, value: defs }
      workspaces:
        - { name: output, workspace: shared }
    - name: build
      runAfter: [clone-defs]
      taskRef:
        name: buildkit-build
      params:
        - { name: IMAGE, value: $(params.IMAGE) }
        - { name: APP_REVISION, value: $(params.APP_REVISION) }
        - { name: DOCKERFILE_DIR, value: $(params.DOCKERFILE_DIR) }
        - { name: REGISTRY_INSECURE, value: $(params.REGISTRY_INSECURE) }
      workspaces:
        - { name: source, workspace: shared, subPath: app }
        - { name: build-defs, workspace: shared, subPath: defs }
        - { name: buildkitd-config, workspace: buildkitd-config }
    - name: scan-attach
      runAfter: [build]
      taskRef:
        name: scan-attach
      params:
        - { name: IMAGE, value: $(params.IMAGE) }
        - { name: APP_REVISION, value: $(params.APP_REVISION) }
        - { name: REGISTRY_INSECURE, value: $(params.REGISTRY_INSECURE) }
      workspaces:
        - { name: shared, workspace: shared }
    - name: gate
      runAfter: [scan-attach]
      taskRef:
        name: gate
      workspaces:
        - { name: shared, workspace: shared }

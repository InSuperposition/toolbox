# T7a spike-proven build; T7b1 rewired for the Pipeline + local zot.
#
# Consumer-agnostic: params only, never names cv_frontend (ADR 0014,
# rules/boundary-ci.yml). The per-consumer values are bound by the
# PipelineRun in deploy/<consumer>/ (a Timoni module — T7b3).
#
# No embedded shell (CLAUDE.md § Constraints): every step is a pinned
# `command` + `args`, never a `script:` block. Two steps — a privileged
# `disable-ipv6` `sysctl` (see below) and the rootless `buildctl-daemonless.sh`.
#
#   * The image is pushed as `$(params.IMAGE):$(params.APP_REVISION)` — the
#     app's git SHA as a deterministic, meaningful tag. There is NO Tekton
#     `IMAGE_DIGEST` result: `scan`/`attach`/`gate` (T7b2/T7b3) address the
#     image by that same tag, ordering is `runAfter`, and `oras resolve`
#     produces the immutable digest ONCE at the operator boundary — the
#     only value-consumer, `attestation-sign.sh`, runs outside the
#     pipeline. ADR 0001 holds: the tag is a convenience alias, the signed
#     chain still pins the digest. (`~/.claude/plans/t7b-pipeline-recut.md`,
#     `TODOS.md` T7b.)
#   * `registry.insecure=$(params.REGISTRY_INSECURE)` — the T7b0 zot is
#     loopback HTTP with no auth (default `true`). A real HTTPS registry
#     sets it `false`; no `dockerconfig` workspace either way (zot is
#     credential-free; `TODOS.md` § "zot registry auth" is the P2 follow-up).
#   * The build CONTEXT is the `source` workspace (the app checkout, staged
#     by the `git-clone` Task). The DOCKERFILE is `$(params.DOCKERFILE_DIR)`
#     within the `build-defs` workspace (a separate toolbox checkout — the
#     two-repo split, ADR 0014). Both workspaces are subPaths of one
#     `volumeClaimTemplate` PVC in the Pipeline (ci/README.md § Workspaces).
#
# The `build` step's posture is the spike-proven minimum for rootless
# BuildKit on `orb start k8s` — NOT privileged, no SYS_ADMIN (TODOS.md T7a,
# ci/README.md § Residual privilege surface). The separate `disable-ipv6`
# step 0 IS privileged; it runs `sysctl` and exits before the build starts.
# Do NOT tighten a `build` field without re-running a real build — each was
# found by iteration:
#   seccomp Unconfined         rootlesskit needs unshare/clone (baseline PSA blocks them)
#   allowPrivilegeEscalation   this image's newuidmap is file-cap based, not setuid;
#     : true                   no_new_privs (which `false` forces) makes the caps a no-op
#   caps add SETUID,SETGID     newuidmap/newgidmap fail "Could not set caps" without both
#   BUILDKITD_FLAGS            --oci-worker-no-process-sandbox is REQUIRED — without it
#                             the dockerfile-frontend step fails to solve
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildkit-build
  labels:
    app.kubernetes.io/part-of: toolbox-ci
spec:
  description: >-
    Build an OCI image from a Dockerfile with daemonless rootless BuildKit
    and push it to a registry, tagged with the app's git SHA. The caller
    resolves the pushed manifest digest with `oras resolve` and pins on it.
  params:
    - name: IMAGE
      type: string
      description: >-
        Target repository reference with no tag, e.g.
        zot.zot.svc.cluster.local:5000/cv-frontend.
    - name: APP_REVISION
      type: string
      description: >-
        The app's git commit SHA. Used as the push tag — deterministic and
        meaningful, not a throwaway.
    - name: PLATFORM
      type: string
      default: linux/arm64
      description: Single target platform (ADR 0008 — arm64 only for now).
    - name: DOCKERFILE
      type: string
      default: Dockerfile
      description: Dockerfile filename within DOCKERFILE_DIR.
    - name: DOCKERFILE_DIR
      type: string
      default: "."
      description: >-
        Directory holding the Dockerfile, relative to the build-defs
        workspace root (e.g. deploy/frontend). Consumer-agnostic — the
        PipelineRun supplies the real path.
    - name: CONTEXT_SUBPATH
      type: string
      default: "."
      description: >-
        Build-context directory relative to the source workspace root.
    - name: REGISTRY_INSECURE
      type: string
      default: "true"
      description: >-
        Passed to buildctl as registry.insecure — true for the loopback
        HTTP zot (T7b0), false for a real HTTPS registry.
    - name: BUILDKITD_FLAGS
      type: string
      default: "--oci-worker-no-process-sandbox"
      description: >-
        Read by buildctl-daemonless.sh. The default is REQUIRED on orb —
        an empty value makes the build fail to solve (TODOS.md T7a).
  workspaces:
    - name: source
      description: The build context — an app checkout (the git-clone Task's app/ subdir).
    - name: build-defs
      description: >-
        A separate checkout holding the Dockerfile (toolbox owns
        deploy/<consumer>/Dockerfile; the app owns the context). The
        two-repo split from ADR 0014.
    - name: buildkitd-config
      mountPath: /cfg
      description: >-
        A ConfigMap with a `buildkitd.toml` key — passed to buildkitd via
        `--config`. Used for the registry mirror that keeps the build off
        external registries (ci/runtime/buildkitd-mirror.yaml; TODOS.md
        T7b1-followup). Bound by the PipelineRun.
  steps:
    # Step 0: this OrbStack cluster gives pods a working AF_INET6 stack +
    # AAAA DNS but no routable v6 egress — buildkitd's registry resolver can
    # pick an unreachable AAAA and hard-fail (`/investigate` 2026-09-08,
    # TODOS.md T7b1-followup). Disabling v6 in the pod netns (DNS/AAAA
    # untouched) forces v4. `sysctl` only, no `script:`. With the mirror
    # config below the build only talks to the in-cluster zot anyway, but
    # this keeps it deterministic if the mirror is ever unbound. `ci` ns is
    # PSA `privileged`; this is the only privileged container. A v4-only
    # Cilium datapath removes the need for it.
    - name: disable-ipv6
      image: docker.io/moby/buildkit:rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
      securityContext:
        privileged: true
        runAsUser: 0
      command: ["sysctl"]
      args:
        - "-w"
        - "net.ipv6.conf.all.disable_ipv6=1"
        - "net.ipv6.conf.default.disable_ipv6=1"
        - "net.ipv6.conf.lo.disable_ipv6=1"
    - name: build
      image: docker.io/moby/buildkit:rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: Unconfined
        allowPrivilegeEscalation: true
        capabilities:
          drop: ["ALL"]
          add: ["SETUID", "SETGID"]
      env:
        - name: HOME
          value: /tekton/home
        - name: BUILDKITD_FLAGS
          value: "$(params.BUILDKITD_FLAGS) --config /cfg/buildkitd.toml"
      command: ["buildctl-daemonless.sh"]
      args:
        - build
        - --frontend=dockerfile.v0
        - --local=context=$(workspaces.source.path)/$(params.CONTEXT_SUBPATH)
        - --local=dockerfile=$(workspaces.build-defs.path)/$(params.DOCKERFILE_DIR)
        - --opt=filename=$(params.DOCKERFILE)
        - --opt=platform=$(params.PLATFORM)
        - --output=type=image,name=$(params.IMAGE):$(params.APP_REVISION),push=true,registry.insecure=$(params.REGISTRY_INSECURE)

# T7a spike-proven build; T7b1 rewired for the Pipeline + local zot.
#
# Consumer-agnostic: params only, never names cv_frontend (ADR 0014,
# rules/boundary-ci.yml). The per-consumer values are bound by the
# PipelineRun in deploy/<consumer>/ (a Timoni module — T7b3).
#
# No embedded shell (CLAUDE.md § Constraints): every step is a pinned
# `command` + `args`, never a `script:` block. Three steps — a privileged
# `disable-ipv6` `sysctl` (see below), the rootless `buildctl-daemonless.sh`,
# and `extract-digest` (below).
#
#   * The image is pushed as `$(params.IMAGE):$(params.APP_REVISION)` — the
#     app's git SHA as a deterministic, meaningful tag; the tag stays a
#     convenience alias (ADR 0001), never the addressing mechanism a
#     downstream Task relies on.
#   * **`IMAGE_DIGEST` result (TODOS.md "Run-scoped build digest identity",
#     P2 — reverses the original T7b OPEN-1 "no Tekton result" call,
#     `~/.claude/plans/t7b-pipeline-recut.md:183`).** That call was right
#     for its own scope: at the time the digest was only ever needed once,
#     post-hoc, by `attestation-sign.sh` outside the pipeline, and
#     `enable-api-fields: alpha` wasn't worth spending just for that. Two
#     things changed: `provenance-sign` (T8) now needs correct digest
#     addressing INSIDE the pipeline (mutable-tag re-resolution lets a
#     concurrent/rerun PipelineRun attach evidence to the wrong image —
#     sequential Tasks within one run don't serialize across runs); and
#     `enable-api-fields: alpha` is already flipped on repo-wide for T8's
#     `stdoutConfig` (`environments/local/scripts/tekton-install.sh`) — the
#     cost the original decision avoided is already sunk, paid for a
#     different reason. `buildctl --metadata-file` writes
#     `containerimage.digest` (the pushed INDEX digest, confirmed via
#     BuildKit's own docs) to `/tekton/home/build-metadata.json` — a
#     Task-local path, NOT a workspace (this Task has no `shared`
#     workspace; `/tekton/home` is Tekton's own pre-created,
#     already-proven-shared-across-this-Task's-steps directory, the same
#     one the `build` step's own `HOME` env already points at). The
#     `extract-digest` step reads it and validates + `stdoutConfig`s the
#     digest to the `IMAGE_DIGEST` result — same `jq` + `stdoutConfig`
#     pattern T8's `provenance-sign.yaml` already proved live, no new
#     mechanism. Downstream Tasks (`scan-attach`, `provenance-sign`)
#     address the image by THIS captured digest, never a re-resolved tag.
#   * `registry.insecure=$(params.REGISTRY_INSECURE)` — governs the OUTPUT
#     (push) leg only; the zot MIRROR entry's own trust is set separately in
#     `buildkitd.toml` (`ci/runtime/buildkitd-mirror.yaml`). T7c R1b-ii-c:
#     zot is HTTPS with a cert-manager dev CA, so the default is `false` and
#     that same buildkitd.toml `ca = [...]` entry covers both directions
#     (buildkitd resolves push and mirror-pull trust by hostname, not by
#     direction).
#   * zot now requires a valid SPIFFE client cert to push (SPIRE Phase 1
#     PR 3, ADR 0025/0026 — no longer credential-free). The `fetch-svid`
#     step below fetches a fresh SVID from the local node's spire-agent
#     Workload API (a hostPath socket — the `spiffe-csi-driver` isn't
#     enabled yet) via the pinned `spiffe-helper` binary, writing it to a
#     fixed path `buildkitd-mirror.yaml`'s zot entry already points its
#     `keypair` at. `daemon_mode = false` (fetch once, exit) is correct
#     here — this Task's steps run sequentially in one pod lifetime, well
#     under a fresh SVID's default TTL, so no rotation/reload is needed.
#   * The build CONTEXT is the `source` workspace (the app checkout, staged
#     by the `git-clone` Task). The DOCKERFILE is `$(params.DOCKERFILE_DIR)`
#     within the `build-defs` workspace (a separate toolbox checkout — the
#     two-repo split, ADR 0014). Both workspaces are subPaths of one
#     `volumeClaimTemplate` PVC in the Pipeline (ci/README.md § Workspaces).
#   * `attest:provenance` (T8, TODOS.md — HOTFIX 2026-09-14, was missing
#     from the original merge despite provenance-sign.yaml's own comments
#     assuming it existed) makes this push a multi-manifest IMAGE INDEX:
#     the platform manifest plus an UNSIGNED attestation manifest whose
#     OCI 1.1 `subject` points at the PLATFORM manifest specifically, not
#     the index (BuildKit's own convention — verified live). The INDEX is
#     what `IMAGE_DIGEST` above captures; deriving the platform-specific
#     digest (and, from it, the attestation manifest) from that index
#     happens in provenance-sign.yaml's own first two steps, not here.
#
# The `build` step's posture is the spike-proven minimum for rootless
# BuildKit on `orb start k8s` — NOT privileged, no SYS_ADMIN (TODOS.md T7a,
# ci/README.md § Residual privilege surface). The separate `disable-ipv6`
# step 0 IS privileged; it runs `sysctl` and exits before the build starts.
# Do NOT tighten a `build` field without re-running a real build — each was
# found by iteration:
#   seccomp Unconfined         rootlesskit needs unshare/clone (baseline PSA blocks them)
#   allowPrivilegeEscalation   this image's newuidmap is file-cap based, not setuid;
#     : true                   no_new_privs (which `false` forces) makes the caps a no-op
#   caps add SETUID,SETGID     newuidmap/newgidmap fail "Could not set caps" without both
#   BUILDKITD_FLAGS            --oci-worker-no-process-sandbox is REQUIRED — without it
#                             the dockerfile-frontend step fails to solve
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildkit-build
  labels:
    app.kubernetes.io/part-of: toolbox-ci
spec:
  description: >-
    Build an OCI image from a Dockerfile with daemonless rootless BuildKit
    and push it to a registry, tagged with the app's git SHA. The digest
    that tag resolved to at push time is captured as the IMAGE_DIGEST
    result — every downstream Task addresses the image by this digest,
    never a re-resolved tag.
  results:
    - name: IMAGE_DIGEST
      description: >-
        The pushed image's INDEX digest (validated `sha256:<64hex>`),
        captured from BuildKit's own `--metadata-file` output at push
        time — not a later `oras resolve` of the mutable tag. This is the
        one run-scoped identity every downstream Task addresses the image
        by (TODOS.md "Run-scoped build digest identity").
  params:
    - name: IMAGE
      type: string
      description: >-
        Target repository reference with no tag, e.g.
        zot.zot.svc.cluster.local:5000/cv-frontend.
    - name: APP_REVISION
      type: string
      description: >-
        The app's git commit SHA. Used as the push tag — deterministic and
        meaningful, not a throwaway.
    - name: APP_REPO_URL
      type: string
      description: >-
        Public HTTPS git URL of the app — threaded into the SLSA provenance
        attestation's vcs:source/vcs:revision build opts (T8, TODOS.md) so
        the attestation carries the actual source identity, not just the
        Dockerfile's embedded bytes.
    - name: PLATFORM
      type: string
      default: linux/arm64
      description: Single target platform (ADR 0008 — arm64 only for now).
    - name: DOCKERFILE
      type: string
      default: Dockerfile
      description: Dockerfile filename within DOCKERFILE_DIR.
    - name: DOCKERFILE_DIR
      type: string
      default: "."
      description: >-
        Directory holding the Dockerfile, relative to the build-defs
        workspace root (e.g. deploy/frontend). Consumer-agnostic — the
        PipelineRun supplies the real path.
    - name: CONTEXT_SUBPATH
      type: string
      default: "."
      description: >-
        Build-context directory relative to the source workspace root.
    - name: REGISTRY_INSECURE
      type: string
      default: "false"
      description: >-
        Passed to buildctl as registry.insecure. "false" — the steady state
        (T7c R1b-ii-c) — trusts zot's HTTPS listener via `ca-bundle` +
        `buildkitd.toml`'s `ca = [...]` entry; "true" is for a genuinely
        insecure registry, not this one.
    - name: BUILDKITD_FLAGS
      type: string
      default: "--oci-worker-no-process-sandbox"
      description: >-
        Read by buildctl-daemonless.sh. The default is REQUIRED on orb —
        an empty value makes the build fail to solve (TODOS.md T7a).
  workspaces:
    - name: source
      description: The build context — an app checkout (the git-clone Task's app/ subdir).
    - name: build-defs
      description: >-
        A separate checkout holding the Dockerfile (toolbox owns
        deploy/<consumer>/Dockerfile; the app owns the context). The
        two-repo split from ADR 0014.
    - name: buildkitd-config
      mountPath: /cfg
      description: >-
        A ConfigMap with a `buildkitd.toml` key — passed to buildkitd via
        `--config`. Used for the registry mirror that keeps the build off
        external registries (ci/runtime/buildkitd-mirror.yaml; TODOS.md
        T7b1-followup). Bound by the PipelineRun.
    - name: ca-bundle
      mountPath: /ca
      description: >-
        A ConfigMap with a `ca-certificates.crt` key — the merged system +
        dev-CA bundle (trust-manager's `toolbox-ca-bundle`, T7c R1b-ii-a).
        `buildkitd.toml`'s zot entry points its `ca = [...]` field at this
        mount. Bound by the PipelineRun.
  steps:
    # Step 0: this OrbStack cluster gives pods a working AF_INET6 stack +
    # AAAA DNS but no routable v6 egress — buildkitd's registry resolver can
    # pick an unreachable AAAA and hard-fail (`/investigate` 2026-09-08,
    # TODOS.md T7b1-followup). Disabling v6 in the pod netns (DNS/AAAA
    # untouched) forces v4. `sysctl` only, no `script:`. With the mirror
    # config below the build only talks to the in-cluster zot anyway, but
    # this keeps it deterministic if the mirror is ever unbound. `ci` ns is
    # PSA `privileged`; this is the only privileged container. A v4-only
    # Cilium datapath removes the need for it.
    - name: disable-ipv6
      image: docker.io/moby/buildkit:rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
      securityContext:
        privileged: true
        runAsUser: 0
      command: ["sysctl"]
      args:
        - "-w"
        - "net.ipv6.conf.all.disable_ipv6=1"
        - "net.ipv6.conf.default.disable_ipv6=1"
        - "net.ipv6.conf.lo.disable_ipv6=1"
    # Fetches this Task's SPIFFE SVID before the build runs — zot now
    # requires it to push (SPIRE Phase 1 PR 3). No embedded shell: the
    # pinned `spiffe-helper` binary is invoked directly, same as every
    # other step in this Task. runAsUser MUST match the `build` step's
    # (1000) — live-verified: spiffe-helper's key file is 0600, owned by
    # whoever wrote it; a UID mismatch between this step and `build` is
    # a real "permission denied" reading it, not a hypothetical.
    - name: fetch-svid
      image: ghcr.io/spiffe/spiffe-helper:0.11.0@sha256:1c92e5998ad3621e3323f25aabe40f5a88ba730ee0edb248aa8c943ca504e8a2
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      command: ["/spiffe-helper"]
      args:
        - -config
        - /spiffe-helper-cfg/helper.hcl
      volumeMounts:
        - name: spiffe-helper-config
          mountPath: /spiffe-helper-cfg
          readOnly: true
        - name: spire-agent-socket
          mountPath: /run/spire/agent-sockets
          readOnly: true
        - name: svid-certs
          mountPath: /svid-certs
    - name: build
      image: docker.io/moby/buildkit:rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: Unconfined
        allowPrivilegeEscalation: true
        capabilities:
          drop: ["ALL"]
          add: ["SETUID", "SETGID"]
      env:
        - name: HOME
          value: /tekton/home
        - name: BUILDKITD_FLAGS
          value: "$(params.BUILDKITD_FLAGS) --config /cfg/buildkitd.toml"
      volumeMounts:
        - name: svid-certs
          mountPath: /svid-certs
          readOnly: true
      command: ["buildctl-daemonless.sh"]
      args:
        - build
        - --frontend=dockerfile.v0
        - --local=context=$(workspaces.source.path)/$(params.CONTEXT_SUBPATH)
        - --local=dockerfile=$(workspaces.build-defs.path)/$(params.DOCKERFILE_DIR)
        - --opt=filename=$(params.DOCKERFILE)
        - --opt=platform=$(params.PLATFORM)
        - --opt=attest:provenance=mode=max,builder-id=https://github.com/InSuperposition/toolbox/blob/main/ci/tasks/buildkit-build.yaml
        - --opt=vcs:source=$(params.APP_REPO_URL)
        - --opt=vcs:revision=$(params.APP_REVISION)
        - --output=type=image,name=$(params.IMAGE):$(params.APP_REVISION),push=true,registry.insecure=$(params.REGISTRY_INSECURE)
        - --metadata-file=/tekton/home/build-metadata.json
    - name: extract-digest
      image: ghcr.io/jqlang/jq:1.8.1@sha256:4f34c6d23f4b1372ac789752cc955dc67c2ae177eb1b5860b75cdc5091ce6f91
      stdoutConfig:
        path: $(results.IMAGE_DIGEST.path)
      command: ["/jq"]
      args:
        - -e
        - -j
        - >-
          .["containerimage.digest"]
          | if test("^sha256:[0-9a-f]{64}$") then . else error("malformed digest") end
        - /tekton/home/build-metadata.json
  # Task-owned infra mounts, not consumer-parameterized (unlike the
  # `workspaces` above) — same class as `disable-ipv6`'s hardcoded
  # sysctl values. spire-agent's Workload API socket is a hostPath since
  # the spiffe-csi-driver isn't enabled yet (ADR 0026); the ConfigMap
  # and emptyDir are `ci/`-owned, fixed, referenced by name directly
  # (same footing as `provenance-signer-sa.yaml`, not per-consumer data).
  volumes:
    - name: spiffe-helper-config
      configMap:
        name: spiffe-helper-config
    - name: spire-agent-socket
      hostPath:
        path: /run/spire/agent-sockets
        type: DirectoryOrCreate
    - name: svid-certs
      emptyDir: {}

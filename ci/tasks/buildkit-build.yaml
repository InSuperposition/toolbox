# T7a — daemonless, rootless BuildKit build → push.
#
# Consumer-agnostic: params only, never names cv_frontend (ADR 0014,
# rules/boundary-ci.yml). The per-consumer PipelineRun that binds real
# values + the pinned bundle digest lives in deploy/<consumer>/ (T7b).
#
# No embedded shell (CLAUDE.md § Constraints): the single step is a pinned
# `command` + `args` — `buildctl` reads DOCKER_CONFIG straight from the
# mounted `dockerconfig` workspace (no cp), and the image is pushed under a
# per-run tag ($(params.TAG), set by tekton-taskrun.sh). tekton-taskrun.sh then
# turns that tag into the manifest digest with `oras resolve`, validates
# it with ci_is_strict_digest (bats-tested), and pins on the digest
# thereafter — the tag is a throwaway lookup handle.
#   (Why not a Tekton IMAGE_DIGEST result: step-stdout→result needs
#    enable-api-fields=alpha, the controller is beta; buildctl has no
#    bare-digest output flag; and coschedule=workspaces forbids a second
#    PVC-backed "meta" workspace. T7b re-adds a proper result via a
#    committed extract script when it builds the Pipeline — TODOS.md T7b.)
#
# Pod posture is the spike-proven minimum for rootless BuildKit on
# `orb start k8s` with NO privileged pod (TODOS.md T7a, ci/README.md
# § Residual privilege surface). Do not tighten a field without re-running
# `mise run ci:taskrun` — each one was found by iteration:
#   seccomp Unconfined         rootlesskit needs unshare/clone (baseline PSA blocks them)
#   allowPrivilegeEscalation   this image's newuidmap is file-cap based, not setuid;
#     : true                   no_new_privs (which `false` forces) makes the caps a no-op
#   caps add SETUID,SETGID     newuidmap/newgidmap fail "Could not set caps" without both
#   BUILDKITD_FLAGS            --oci-worker-no-process-sandbox is REQUIRED — without it
#                             the dockerfile-frontend step fails to solve
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildkit-build
  labels:
    app.kubernetes.io/part-of: toolbox-ci
spec:
  description: >-
    Build an OCI image from a Dockerfile with daemonless rootless BuildKit
    and push it to a registry under a caller-supplied tag. The caller
    (tekton-taskrun.sh) resolves the pushed manifest digest and pins on it.
  params:
    - name: IMAGE
      type: string
      description: >-
        Target repository reference with no tag, e.g.
        registry.example/org/app.
    - name: TAG
      type: string
      description: >-
        Tag to push under, e.g. tekton-taskrun-<run-id>. A throwaway lookup
        handle — the caller resolves the digest from it and pins on the
        digest; it may delete the tag afterwards.
    - name: PLATFORM
      type: string
      default: linux/arm64
      description: Single target platform (ADR 0008 — arm64 only for now).
    - name: DOCKERFILE
      type: string
      default: Dockerfile
      description: Dockerfile filename within the build-defs workspace root.
    - name: CONTEXT_SUBPATH
      type: string
      default: "."
      description: >-
        Build-context directory relative to the source workspace root.
        "." means the workspace root is the context.
    - name: BUILDKITD_FLAGS
      type: string
      default: "--oci-worker-no-process-sandbox"
      description: >-
        Read by buildctl-daemonless.sh. The default is REQUIRED on orb —
        an empty value makes the build fail to solve (TODOS.md T7a).
  workspaces:
    - name: source
      description: The build context (an app checkout).
    - name: build-defs
      description: >-
        The directory holding the Dockerfile — a separate checkout
        (toolbox owns deploy/<consumer>/Dockerfile; the app owns the
        context). This is the two-repo split from ADR 0014 / the T7a plan.
    - name: dockerconfig
      description: >-
        A Secret with a single `config.json` key holding registry push
        credentials for IMAGE. Projected read-only and pointed at by
        DOCKER_CONFIG — buildctl reads it directly, no copy.
  steps:
    - name: build
      image: docker.io/moby/buildkit:rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: Unconfined
        allowPrivilegeEscalation: true
        capabilities:
          drop: ["ALL"]
          add: ["SETUID", "SETGID"]
      env:
        - name: HOME
          value: /tekton/home
        - name: DOCKER_CONFIG
          value: $(workspaces.dockerconfig.path)
        - name: BUILDKITD_FLAGS
          value: $(params.BUILDKITD_FLAGS)
      command: ["buildctl-daemonless.sh"]
      args:
        - build
        - --frontend=dockerfile.v0
        - --local=context=$(workspaces.source.path)/$(params.CONTEXT_SUBPATH)
        - --local=dockerfile=$(workspaces.build-defs.path)
        - --opt=filename=$(params.DOCKERFILE)
        - --opt=platform=$(params.PLATFORM)
        - --output=type=image,name=$(params.IMAGE):$(params.TAG),push=true

# Signs BuildKit's own native SLSA provenance output (pushed as an
# UNSIGNED referrer by the `build` Task's `attest:provenance=` opt) with
# the `chains-provenance-key` OpenBao Transit key — the same `cosign
# attest` + OpenBao-Transit pattern `attestation-sign.sh` uses for
# `approval-key`, reused here instead of a separate provenance tool.
#
# BuildKit's attestation manifest carries an OCI 1.1 `subject` pointing at
# the PLATFORM manifest, never the index the tag resolves to — the
# attestation manifest's own sentinel entry is
# `platform: {architecture: unknown, os: unknown}`, filtered out by
# `resolve-platform-digest` below, matching BuildKit's own convention for
# marking a non-runnable index entry.
#
# `resolve-attestation-digest` derives the attestation manifest's digest
# from BuildKit's own OCI-native linking annotations on the SAME index
# (`vnd.docker.reference.type` / `vnd.docker.reference.digest`) rather than
# a separate `oras discover` query — `oras discover`'s `.referrers[0]` is a
# first-match pick, ambiguous if two runs ever produce a byte-identical
# platform manifest with different provenance. The platform manifest
# entries in the index carry no `annotations` field at all (only the
# attestation entry does), so the go-template guards with
# `{{if .annotations}}` before indexing into it.
#
# This Task takes a `DIGEST` param (the INDEX digest `build` captured at
# push time and propagated as a Pipeline result) instead of re-resolving
# the mutable `APP_REVISION` tag — closes the gap where a concurrent/rerun
# PipelineRun could sign provenance for the wrong image.
#
# Consumer-agnostic: params only. Runs `runAfter: [scan-attach]` in
# build-scan-approve.yaml (sequential — see that Pipeline's own header
# comment for why not parallel).
#
# No embedded shell: every step is a single pinned `command` + `args`,
# never a `script:` block. Seven steps, each one CLI call. The only
# non-obvious plumbing is `stdoutConfig` (Tekton alpha,
# `environments/local/scripts/tekton-install.sh` enables it) — a step's
# stdout is duplicated to a file by TEKTON ITSELF (no shell redirection),
# and a LATER step's `args` can reference an earlier step's captured
# result via `$(steps.<name>.results.<name>)` — pure declarative
# substitution. Small values (digests, refs) go through `results:`
# (Tekton's ~4KB size cap); the predicate content itself (can exceed that
# for a real build) goes straight to a `shared`-workspace file instead.
#
# No `disable-ipv6` step: unlike `git-clone`/`buildkit-build`/`scan-attach`,
# every endpoint this Task reaches (zot, OpenBao) is in-cluster ClusterIP
# DNS — the OrbStack IPv6-egress defect only affects EXTERNAL fetches.
#
# Auth: the `provenance-signer` ServiceAccount
# (`ci/runtime/provenance-signer-sa.yaml`) is bound, by the PipelineRun's
# `taskRunSpecs` override (`deploy/frontend/pipelinerun.cue`), to run ONLY
# this Task — every other Task keeps the namespace default SA. It
# authenticates to OpenBao's `chains_provenance` k8s-auth role
# (`environments/local/openbao/main.tf`) via a PROJECTED token whose
# `audience` matches the role's config exactly — a default-automounted
# token's audience does NOT match and login fails 403. `bao login` writes
# `$HOME/.vault-token` (its own token-helper convention); cosign's
# hashivault KMS client reads that file automatically — no VAULT_TOKEN env
# needed, no token ever appears in a Task param or log. `openbao-login`
# and `cosign-attest` both run as the SAME explicit `runAsUser: 65532` and
# share `HOME=/tekton/home` (Tekton's own per-pod pre-created `emptyDir`)
# — `bao login` writes `.vault-token` `0600`, owner-only, so both
# containers must be the same UID for cosign to read it back.
# `VAULT_CACERT` only configures the hashivault KMS client's connection to
# OpenBao; the registry push to zot is a separate Go `net/http` client
# that instead honors `SSL_CERT_FILE`, set explicitly here. This role
# signs `chains-provenance-key` and is denied `approval-key`.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: provenance-sign
  labels:
    app.kubernetes.io/part-of: toolbox-ci
spec:
  description: >-
    Sign BuildKit's own SLSA provenance attestation (already pushed
    unsigned) with the chains-provenance-key OpenBao Transit key.
    Evidence-only — never a second enforced gate; approval-key remains the
    one real gate.
  params:
    - name: IMAGE
      type: string
      description: Target repo ref, no tag (e.g. zot.zot.svc.cluster.local:5000/cv-frontend).
    - name: DIGEST
      type: string
      description: >-
        The pushed image's INDEX digest (`build`'s `IMAGE_DIGEST` result)
        — validated `sha256:<64hex>` by the Task that produced it.
    - name: REGISTRY_INSECURE
      type: string
      default: "false"
      description: >-
        Skip TLS verification for oras/cosign registry calls. "false" — the
        steady state — trusts zot via the `ca-bundle` workspace instead.
  workspaces:
    - name: shared
      description: >-
        The per-run PVC. Holds the fetched provenance statement and the
        extracted predicate before signing.
    - name: ca-bundle
      mountPath: /ca
      description: >-
        The merged system + dev-CA bundle (trust-manager's
        `toolbox-ca-bundle`) — the SAME `toolbox-dev-ca` root
        signs both zot's and OpenBao's listener certs, so one bundle
        covers oras/cosign→zot AND bao→OpenBao TLS trust.
  steps:
    - name: resolve-platform-digest
      image: ghcr.io/oras-project/oras:v1.3.4@sha256:f7bc056d54d97baa399414ed5048ecc67c3371b750d4bbce1d871827a5758179
      results:
        - name: platform-digest
          description: >-
            The single-platform manifest's digest (arm64-only) —
            NOT the index digest the tag resolves to. BuildKit's provenance
            attestation manifest carries an OCI 1.1 `subject` pointing at
            THIS digest, never the index — `oras discover` against the
            tag/index finds zero referrers; against this digest it finds
            the attestation manifest. The attestation manifest's own
            sentinel is `platform: {architecture: unknown, os: unknown}` —
            filtered out here, matching BuildKit's own convention for
            marking a non-runnable entry in the index.
      stdoutConfig:
        path: $(step.results.platform-digest.path)
      command: ["oras"]
      args:
        - manifest
        - fetch
        - --ca-file=/ca/ca-certificates.crt
        - --format=go-template
        - --template={{range .content.manifests}}{{if ne .platform.architecture "unknown"}}{{.digest}}{{end}}{{end}}
        - $(params.IMAGE)@$(params.DIGEST)
    - name: resolve-attestation-digest
      image: ghcr.io/oras-project/oras:v1.3.4@sha256:f7bc056d54d97baa399414ed5048ecc67c3371b750d4bbce1d871827a5758179
      results:
        - name: attestation-digest
          description: >-
            The unsigned attestation manifest's digest, resolved from the
            SAME index `resolve-platform-digest` fetched — not a separate
            `oras discover` registry query, since `oras discover`'s
            `.referrers[0]` is a first-match pick, ambiguous if two runs
            ever produce a byte-identical platform manifest with different
            provenance. Matched by BuildKit's own OCI-native linking
            annotations on the attestation descriptor within the index
            (see docs.docker.com/build/metadata/attestations/attestation-storage/):
            `vnd.docker.reference.type: "attestation-manifest"` +
            `vnd.docker.reference.digest: <platform-manifest-digest>` —
            an exact link, not a guess.
      stdoutConfig:
        path: $(step.results.attestation-digest.path)
      command: ["oras"]
      args:
        - manifest
        - fetch
        - --ca-file=/ca/ca-certificates.crt
        - --format=go-template
        - --template={{range .content.manifests}}{{if .annotations}}{{if and (eq (index .annotations "vnd.docker.reference.type") "attestation-manifest") (eq (index .annotations "vnd.docker.reference.digest") "$(steps.resolve-platform-digest.results.platform-digest)")}}{{.digest}}{{end}}{{end}}{{end}}
        - $(params.IMAGE)@$(params.DIGEST)
    - name: fetch-attestation-manifest
      image: ghcr.io/oras-project/oras:v1.3.4@sha256:f7bc056d54d97baa399414ed5048ecc67c3371b750d4bbce1d871827a5758179
      results:
        - name: layer-digest
          description: The predicate layer's digest within the attestation manifest.
      stdoutConfig:
        path: $(step.results.layer-digest.path)
      command: ["oras"]
      args:
        - manifest
        - fetch
        - --ca-file=/ca/ca-certificates.crt
        - --format=go-template
        - --template={{(index .content.layers 0).digest}}
        - $(params.IMAGE)@$(steps.resolve-attestation-digest.results.attestation-digest)
    - name: fetch-predicate-statement
      image: ghcr.io/oras-project/oras:v1.3.4@sha256:f7bc056d54d97baa399414ed5048ecc67c3371b750d4bbce1d871827a5758179
      workingDir: $(workspaces.shared.path)
      command: ["oras"]
      args:
        - blob
        - fetch
        - --ca-file=/ca/ca-certificates.crt
        - --output=$(workspaces.shared.path)/provenance-statement.json
        - $(params.IMAGE)@$(steps.fetch-attestation-manifest.results.layer-digest)
    - name: extract-predicate
      image: ghcr.io/jqlang/jq:1.8.1@sha256:4f34c6d23f4b1372ac789752cc955dc67c2ae177eb1b5860b75cdc5091ce6f91
      stdoutConfig:
        path: $(workspaces.shared.path)/provenance-predicate.json
      command: ["/jq"]
      args:
        - -c
        - .predicate
        - $(workspaces.shared.path)/provenance-statement.json
    - name: openbao-login
      image: quay.io/openbao/openbao:2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
      securityContext:
        runAsUser: 65532
      env:
        - { name: HOME, value: /tekton/home }
        - { name: BAO_ADDR, value: https://openbao.openbao.svc.cluster.local:8200 }
        - { name: BAO_CACERT, value: /ca/ca-certificates.crt }
      command: ["bao"]
      args:
        - login
        - -method=kubernetes
        - role=chains_provenance
        - jwt=@/var/run/secrets/openbao-auth/token
      volumeMounts:
        - { name: openbao-auth-token, mountPath: /var/run/secrets/openbao-auth }
    - name: cosign-attest
      image: gcr.io/projectsigstore/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
      securityContext:
        runAsUser: 65532
      env:
        - { name: HOME, value: /tekton/home }
        - { name: VAULT_ADDR, value: https://openbao.openbao.svc.cluster.local:8200 }
        - { name: VAULT_CACERT, value: /ca/ca-certificates.crt }
        - { name: SSL_CERT_FILE, value: /ca/ca-certificates.crt }
      command: ["/ko-app/cosign"]
      args:
        - attest
        - --predicate=$(workspaces.shared.path)/provenance-predicate.json
        - --type=https://slsa.dev/provenance/v1
        - --key=openbao://chains-provenance-key
        - --use-signing-config=false
        - --tlog-upload=false
        - $(params.IMAGE)@$(steps.resolve-platform-digest.results.platform-digest)
  # cosign-attest's subject stays the PLATFORM digest (not the INDEX
  # `$(params.DIGEST)`) — matches where BuildKit's own `subject` field on
  # the attestation manifest points. The INDEX digest and the PLATFORM
  # digest are DIFFERENT values by design; never asserted equal.
  volumes:
    - name: openbao-auth-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              # MUST match environments/local/openbao/main.tf's
              # chains_provenance role `audience` (= var.openbao_endpoint)
              # exactly — a default-audience token is REJECTED (403,
              # confirmed live). Short-lived: this Task's own step, not a
              # long-running pod.
              audience: https://openbao.openbao.svc.cluster.local:8200
              expirationSeconds: 600

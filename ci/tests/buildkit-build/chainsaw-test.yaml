# [k8s]-gated (ci/scripts/chainsaw-test.sh skips without an orbstack cluster
# + Tekton). Server-side validation the static kubeconform gate cannot do:
# the Tekton admission webhook accepts our Task YAML, the spike-proven
# securityContext posture has not drifted, and the Task carries NO embedded
# shell (CLAUDE.md § Constraints — the whole point of the refactor).
#
# The full build → push → arm64 → no-privileged-pod assertions need a real
# registry credential and a ~90s build; they are covered by
# `mise run ci:taskrun` (manual, [k8s]) and the recorded live spike
# (TODOS.md T7a). T7b's digest-pinned git-clone Task makes a credential-
# light chainsaw build feasible — added then.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: buildkit-build
spec:
  steps:
    - name: tekton-accepts-the-task
      try:
        - apply:
            file: ../../tasks/buildkit-build.yaml
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: buildkit-build
              spec:
                workspaces:
                  - name: source
                  - name: build-defs
                  - name: dockerconfig
    - name: no-embedded-shell
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: buildkit-build
              spec:
                # exactly one step, named `build`, and NO step has a `script`
                (length(steps)): 1
                (steps[0].name): build
                (steps[?script != null]): []
    - name: security-posture-has-not-drifted
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: buildkit-build
              spec:
                steps:
                  - name: build
                    securityContext:
                      runAsUser: 1000
                      runAsNonRoot: true
                      allowPrivilegeEscalation: true
                      seccompProfile:
                        type: Unconfined
                      capabilities:
                        drop: [ALL]
                        add: [SETUID, SETGID]
                    # never privileged, never SYS_ADMIN / SYS_PTRACE
                    (securityContext.privileged || 'unset'): unset
                    (contains(securityContext.capabilities.add, 'SYS_ADMIN')): false
                    (contains(securityContext.capabilities.add, 'SYS_PTRACE')): false

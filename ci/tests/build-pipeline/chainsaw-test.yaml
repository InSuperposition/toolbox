# [k8s]-gated (ci/scripts/chainsaw-test.sh skips without an orbstack cluster
# + Tekton). Server-side validation the static kubeconform gate cannot do:
# the Tekton admission webhook accepts the defs, none carries embedded
# shell (CLAUDE.md § Constraints), the spike-proven build posture has not
# drifted, the only privileged container in each Task is its `disable-ipv6`
# sysctl step (TODOS.md T7b1-followup) — `provenance-sign` (T8) has NONE,
# every endpoint it reaches is in-cluster — and the Pipeline DAG is
# clone-app -> clone-defs -> build -> scan-attach -> provenance-sign -> gate
# over the `shared` workspace with a `buildkitd-config` ConfigMap workspace.
#
# The full clone -> build -> push -> `oras resolve` -> `docker pull` run
# needs registry + git egress and a ~90s build; it is proven by an
# operator `tkn pipeline start` (recorded in TODOS.md T7b1) the same way
# T7a's spike proved buildkit. T7b2/T7b3 add scan/attach/gate to this file.
#
# T7b3 G1 — the gate's blocking path is proven WITHOUT a build: a standalone
# `gate` TaskRun reads a fixture scan.json (a ConfigMap workspace) and its
# terminated exitCode is asserted: 2 on a CRITICAL finding (TaskRun fails),
# 0 on a LOW-only report (TaskRun succeeds), 1 on a malformed report (TaskRun
# fails, but as an error not a verdict). Fixtures: fixtures/scan-*.yaml.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: build-pipeline
spec:
  steps:
    - name: webhook-accepts-the-defs
      try:
        - apply:
            file: ../../tasks/git-clone.yaml
        - apply:
            file: ../../tasks/buildkit-build.yaml
        - apply:
            file: ../../tasks/scan-attach.yaml
        - apply:
            file: ../../tasks/provenance-sign.yaml
        - apply:
            file: ../../tasks/gate.yaml
        - apply:
            file: ../../pipelines/build-scan-approve.yaml
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: git-clone
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: scan-attach
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: provenance-sign
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: gate
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Pipeline
              metadata:
                name: build-scan-approve
    - name: no-embedded-shell
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: git-clone
              spec:
                (length(steps)): 3
                (steps[?script != null]): []
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: buildkit-build
              spec:
                (length(steps)): 4
                (steps[?script != null]): []
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: scan-attach
              spec:
                (length(steps)): 5
                (steps[?script != null]): []
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: gate
              spec:
                (length(steps)): 1
                (steps[?script != null]): []
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: provenance-sign
              spec:
                (length(steps)): 7
                (steps[?script != null]): []
    - name: build-posture-has-not-drifted
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: buildkit-build
              spec:
                steps:
                  - name: disable-ipv6
                    securityContext:
                      privileged: true
                      runAsUser: 0
                  - name: fetch-svid
                    (securityContext.privileged || 'unset'): unset
                  - name: build
                    securityContext:
                      runAsUser: 1000
                      runAsNonRoot: true
                      allowPrivilegeEscalation: true
                      seccompProfile:
                        type: Unconfined
                      capabilities:
                        drop: [ALL]
                        add: [SETUID, SETGID]
                    (securityContext.privileged || 'unset'): unset
                    (contains(securityContext.capabilities.add, 'SYS_ADMIN')): false
                    (contains(securityContext.capabilities.add, 'SYS_PTRACE')): false
                  - name: extract-digest
                    (securityContext.privileged || 'unset'): unset
    - name: git-clone-only-the-sysctl-step-is-privileged
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: git-clone
              spec:
                steps:
                  - name: disable-ipv6
                    securityContext:
                      privileged: true
                      runAsUser: 0
                    command: [sysctl]
                  - name: clone
                    (securityContext.privileged || 'unset'): unset
                  - name: checkout
                    (securityContext.privileged || 'unset'): unset
    - name: scan-attach-only-the-sysctl-step-is-privileged
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: scan-attach
              spec:
                steps:
                  - name: disable-ipv6
                    securityContext:
                      privileged: true
                      runAsUser: 0
                    command: [sysctl]
                  - name: trivy-report-json
                    (securityContext.privileged || 'unset'): unset
                  - name: trivy-sbom-cyclonedx
                    (securityContext.privileged || 'unset'): unset
                  - name: oras-attach-scan-report
                    (securityContext.privileged || 'unset'): unset
                  - name: oras-attach-sbom
                    (securityContext.privileged || 'unset'): unset
    - name: gate-has-no-privileged-step
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: gate
              spec:
                steps:
                  - name: gate
                    command: [trivy]
                    (securityContext.privileged || 'unset'): unset
    - name: provenance-sign-has-no-privileged-step
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: provenance-sign
              spec:
                steps:
                  - name: resolve-platform-digest
                    command: [oras]
                    (securityContext.privileged || 'unset'): unset
                  - name: resolve-attestation-digest
                    command: [oras]
                    (securityContext.privileged || 'unset'): unset
                  - name: fetch-attestation-manifest
                    command: [oras]
                    (securityContext.privileged || 'unset'): unset
                  - name: fetch-predicate-statement
                    command: [oras]
                    (securityContext.privileged || 'unset'): unset
                  - name: extract-predicate
                    command: ["/jq"]
                    (securityContext.privileged || 'unset'): unset
                  - name: openbao-login
                    command: [bao]
                    (securityContext.privileged || 'unset'): unset
                  - name: cosign-attest
                    command: ["/ko-app/cosign"]
                    (securityContext.privileged || 'unset'): unset
    - name: pipeline-shape
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Pipeline
              metadata:
                name: build-scan-approve
              spec:
                workspaces:
                  - name: shared
                  - name: buildkitd-config
                  - name: ca-bundle
                results:
                  - name: IMAGE_DIGEST
                    value: $(tasks.build.results.IMAGE_DIGEST)
                tasks:
                  - name: clone-app
                    retries: 2
                    taskRef:
                      name: git-clone
                  - name: clone-defs
                    runAfter: [clone-app]
                    retries: 2
                    taskRef:
                      name: git-clone
                  - name: build
                    runAfter: [clone-defs]
                    taskRef:
                      name: buildkit-build
                    workspaces:
                      - name: source
                        workspace: shared
                        subPath: app
                      - name: build-defs
                        workspace: shared
                        subPath: defs
                      - name: buildkitd-config
                        workspace: buildkitd-config
                      - name: ca-bundle
                        workspace: ca-bundle
                  - name: scan-attach
                    runAfter: [build]
                    taskRef:
                      name: scan-attach
                    workspaces:
                      - name: shared
                        workspace: shared
                      - name: ca-bundle
                        workspace: ca-bundle
                  - name: provenance-sign
                    runAfter: [scan-attach]
                    taskRef:
                      name: provenance-sign
                    workspaces:
                      - name: shared
                        workspace: shared
                      - name: ca-bundle
                        workspace: ca-bundle
                  - name: gate
                    runAfter: [provenance-sign]
                    taskRef:
                      name: gate
                    workspaces:
                      - name: shared
                        workspace: shared
    # G1 — the gate's blocking path, no build required. A standalone `gate`
    # TaskRun reads a fixture scan.json off a ConfigMap workspace; the
    # terminated exitCode of its one step is the assertion.
    - name: gate-fails-a-taskrun-on-a-critical-finding
      try:
        - apply:
            file: fixtures/scan-critical.yaml
        - apply:
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-critical
              spec:
                taskRef:
                  name: gate
                workspaces:
                  - name: shared
                    configMap:
                      name: gate-fixture-critical
        - assert:
            timeout: 240s
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-critical
              status:
                (conditions[?type == 'Succeeded'] | [0].status): "False"
                (steps[?name == 'gate'] | [0].terminated.exitCode): 2
    - name: gate-passes-a-taskrun-with-no-critical-finding
      try:
        - apply:
            file: fixtures/scan-clean.yaml
        - apply:
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-clean
              spec:
                taskRef:
                  name: gate
                workspaces:
                  - name: shared
                    configMap:
                      name: gate-fixture-clean
        - assert:
            timeout: 240s
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-clean
              status:
                (conditions[?type == 'Succeeded'] | [0].status): "True"
                (steps[?name == 'gate'] | [0].terminated.exitCode): 0
    - name: gate-errors-not-a-verdict-on-a-malformed-report
      try:
        - apply:
            file: fixtures/scan-malformed.yaml
        - apply:
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-malformed
              spec:
                taskRef:
                  name: gate
                workspaces:
                  - name: shared
                    configMap:
                      name: gate-fixture-malformed
        - assert:
            timeout: 240s
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-malformed
              status:
                (conditions[?type == 'Succeeded'] | [0].status): "False"
                (steps[?name == 'gate'] | [0].terminated.exitCode): 1
    # Run-scoped build digest identity (TODOS.md) — the extract-digest jq
    # validation logic, tested in isolation, no real build needed (same
    # G1 pattern as the gate tests above: a standalone TaskRun + a fixture
    # ConfigMap). The real step (buildkit-build.yaml) reads a hardcoded
    # /tekton/home path; this inline taskSpec exercises the SAME jq
    # expression against a workspace-mounted fixture instead — parallel
    # logic, not literal path reuse, same relationship G1's `gate` fixture
    # tests already have to the real Pipeline wiring.
    - name: extract-digest-accepts-a-valid-sha256
      try:
        - apply:
            file: fixtures/build-metadata-valid.yaml
        - apply:
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: extract-digest-valid
              spec:
                taskSpec:
                  workspaces:
                    - name: shared
                  results:
                    - name: IMAGE_DIGEST
                  steps:
                    - name: extract-digest
                      image: ghcr.io/jqlang/jq:1.8.1@sha256:4f34c6d23f4b1372ac789752cc955dc67c2ae177eb1b5860b75cdc5091ce6f91
                      stdoutConfig:
                        path: $(results.IMAGE_DIGEST.path)
                      command: ["/jq"]
                      args:
                        - -e
                        - -j
                        - >-
                          .["containerimage.digest"]
                          | if test("^sha256:[0-9a-f]{64}$") then . else error("malformed digest") end
                        - $(workspaces.shared.path)/build-metadata.json
                workspaces:
                  - name: shared
                    configMap:
                      name: extract-digest-fixture-valid
        - assert:
            timeout: 240s
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: extract-digest-valid
              status:
                (conditions[?type == 'Succeeded'] | [0].status): "True"
                (results[?name == 'IMAGE_DIGEST'] | [0].value): sha256:d7a452f4712c6eecd1184cd8f23d0777b35369dd0395c5854635fa249e3cda38
    - name: extract-digest-rejects-a-malformed-digest
      try:
        - apply:
            file: fixtures/build-metadata-malformed.yaml
        - apply:
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: extract-digest-malformed
              spec:
                taskSpec:
                  workspaces:
                    - name: shared
                  results:
                    - name: IMAGE_DIGEST
                  steps:
                    - name: extract-digest
                      image: ghcr.io/jqlang/jq:1.8.1@sha256:4f34c6d23f4b1372ac789752cc955dc67c2ae177eb1b5860b75cdc5091ce6f91
                      stdoutConfig:
                        path: $(results.IMAGE_DIGEST.path)
                      command: ["/jq"]
                      args:
                        - -e
                        - -j
                        - >-
                          .["containerimage.digest"]
                          | if test("^sha256:[0-9a-f]{64}$") then . else error("malformed digest") end
                        - $(workspaces.shared.path)/build-metadata.json
                workspaces:
                  - name: shared
                    configMap:
                      name: extract-digest-fixture-malformed
        - assert:
            timeout: 240s
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: extract-digest-malformed
              status:
                (conditions[?type == 'Succeeded'] | [0].status): "False"
    - name: extract-digest-rejects-a-missing-key
      try:
        - apply:
            file: fixtures/build-metadata-missing.yaml
        - apply:
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: extract-digest-missing
              spec:
                taskSpec:
                  workspaces:
                    - name: shared
                  results:
                    - name: IMAGE_DIGEST
                  steps:
                    - name: extract-digest
                      image: ghcr.io/jqlang/jq:1.8.1@sha256:4f34c6d23f4b1372ac789752cc955dc67c2ae177eb1b5860b75cdc5091ce6f91
                      stdoutConfig:
                        path: $(results.IMAGE_DIGEST.path)
                      command: ["/jq"]
                      args:
                        - -e
                        - -j
                        - >-
                          .["containerimage.digest"]
                          | if test("^sha256:[0-9a-f]{64}$") then . else error("malformed digest") end
                        - $(workspaces.shared.path)/build-metadata.json
                workspaces:
                  - name: shared
                    configMap:
                      name: extract-digest-fixture-missing
        - assert:
            timeout: 240s
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: extract-digest-missing
              status:
                (conditions[?type == 'Succeeded'] | [0].status): "False"

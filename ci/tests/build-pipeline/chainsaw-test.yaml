# [k8s]-gated (ci/scripts/chainsaw-test.sh skips without an orbstack cluster
# + Tekton). Server-side validation the static kubeconform gate cannot do:
# the Tekton admission webhook accepts the four defs, none carries embedded
# shell (CLAUDE.md § Constraints), the spike-proven build posture has not
# drifted, the only privileged container in each Task is its `disable-ipv6`
# sysctl step (TODOS.md T7b1-followup), and the Pipeline DAG is
# clone-app -> clone-defs -> build -> scan-attach over the `shared` workspace
# with a `buildkitd-config` ConfigMap workspace.
#
# The full clone -> build -> push -> `oras resolve` -> `docker pull` run
# needs registry + git egress and a ~90s build; it is proven by an
# operator `tkn pipeline start` (recorded in TODOS.md T7b1) the same way
# T7a's spike proved buildkit. T7b2/T7b3 add scan/attach/gate to this file.
#
# T7b3 G1 — the gate's blocking path is proven WITHOUT a build: a standalone
# `gate` TaskRun reads a fixture scan.json (a ConfigMap workspace) and its
# terminated exitCode is asserted: 2 on a CRITICAL finding (TaskRun fails),
# 0 on a LOW-only report (TaskRun succeeds), 1 on a malformed report (TaskRun
# fails, but as an error not a verdict). Fixtures: fixtures/scan-*.yaml.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: build-pipeline
spec:
  steps:
    - name: webhook-accepts-the-defs
      try:
        - apply:
            file: ../../tasks/git-clone.yaml
        - apply:
            file: ../../tasks/buildkit-build.yaml
        - apply:
            file: ../../tasks/scan-attach.yaml
        - apply:
            file: ../../tasks/gate.yaml
        - apply:
            file: ../../pipelines/build-scan-approve.yaml
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: git-clone
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: scan-attach
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: gate
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Pipeline
              metadata:
                name: build-scan-approve
    - name: no-embedded-shell
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: git-clone
              spec:
                (length(steps)): 3
                (steps[?script != null]): []
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: buildkit-build
              spec:
                (length(steps)): 2
                (steps[?script != null]): []
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: scan-attach
              spec:
                (length(steps)): 5
                (steps[?script != null]): []
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: gate
              spec:
                (length(steps)): 1
                (steps[?script != null]): []
    - name: build-posture-has-not-drifted
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: buildkit-build
              spec:
                steps:
                  - name: disable-ipv6
                    securityContext:
                      privileged: true
                      runAsUser: 0
                  - name: build
                    securityContext:
                      runAsUser: 1000
                      runAsNonRoot: true
                      allowPrivilegeEscalation: true
                      seccompProfile:
                        type: Unconfined
                      capabilities:
                        drop: [ALL]
                        add: [SETUID, SETGID]
                    (securityContext.privileged || 'unset'): unset
                    (contains(securityContext.capabilities.add, 'SYS_ADMIN')): false
                    (contains(securityContext.capabilities.add, 'SYS_PTRACE')): false
    - name: git-clone-only-the-sysctl-step-is-privileged
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: git-clone
              spec:
                steps:
                  - name: disable-ipv6
                    securityContext:
                      privileged: true
                      runAsUser: 0
                    command: [sysctl]
                  - name: clone
                    (securityContext.privileged || 'unset'): unset
                  - name: checkout
                    (securityContext.privileged || 'unset'): unset
    - name: scan-attach-only-the-sysctl-step-is-privileged
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: scan-attach
              spec:
                steps:
                  - name: disable-ipv6
                    securityContext:
                      privileged: true
                      runAsUser: 0
                    command: [sysctl]
                  - name: trivy-report-json
                    (securityContext.privileged || 'unset'): unset
                  - name: trivy-sbom-cyclonedx
                    (securityContext.privileged || 'unset'): unset
                  - name: oras-attach-scan-report
                    (securityContext.privileged || 'unset'): unset
                  - name: oras-attach-sbom
                    (securityContext.privileged || 'unset'): unset
    - name: gate-has-no-privileged-step
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Task
              metadata:
                name: gate
              spec:
                steps:
                  - name: gate
                    command: [trivy]
                    (securityContext.privileged || 'unset'): unset
    - name: pipeline-shape
      try:
        - assert:
            resource:
              apiVersion: tekton.dev/v1
              kind: Pipeline
              metadata:
                name: build-scan-approve
              spec:
                workspaces:
                  - name: shared
                  - name: buildkitd-config
                  - name: ca-bundle
                tasks:
                  - name: clone-app
                    retries: 2
                    taskRef:
                      name: git-clone
                  - name: clone-defs
                    runAfter: [clone-app]
                    retries: 2
                    taskRef:
                      name: git-clone
                  - name: build
                    runAfter: [clone-defs]
                    taskRef:
                      name: buildkit-build
                    workspaces:
                      - name: source
                        workspace: shared
                        subPath: app
                      - name: build-defs
                        workspace: shared
                        subPath: defs
                      - name: buildkitd-config
                        workspace: buildkitd-config
                      - name: ca-bundle
                        workspace: ca-bundle
                  - name: scan-attach
                    runAfter: [build]
                    taskRef:
                      name: scan-attach
                    workspaces:
                      - name: shared
                        workspace: shared
                      - name: ca-bundle
                        workspace: ca-bundle
                  - name: gate
                    runAfter: [scan-attach]
                    taskRef:
                      name: gate
                    workspaces:
                      - name: shared
                        workspace: shared
    # G1 — the gate's blocking path, no build required. A standalone `gate`
    # TaskRun reads a fixture scan.json off a ConfigMap workspace; the
    # terminated exitCode of its one step is the assertion.
    - name: gate-fails-a-taskrun-on-a-critical-finding
      try:
        - apply:
            file: fixtures/scan-critical.yaml
        - apply:
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-critical
              spec:
                taskRef:
                  name: gate
                workspaces:
                  - name: shared
                    configMap:
                      name: gate-fixture-critical
        - assert:
            timeout: 240s
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-critical
              status:
                (conditions[?type == 'Succeeded'] | [0].status): "False"
                (steps[?name == 'gate'] | [0].terminated.exitCode): 2
    - name: gate-passes-a-taskrun-with-no-critical-finding
      try:
        - apply:
            file: fixtures/scan-clean.yaml
        - apply:
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-clean
              spec:
                taskRef:
                  name: gate
                workspaces:
                  - name: shared
                    configMap:
                      name: gate-fixture-clean
        - assert:
            timeout: 240s
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-clean
              status:
                (conditions[?type == 'Succeeded'] | [0].status): "True"
                (steps[?name == 'gate'] | [0].terminated.exitCode): 0
    - name: gate-errors-not-a-verdict-on-a-malformed-report
      try:
        - apply:
            file: fixtures/scan-malformed.yaml
        - apply:
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-malformed
              spec:
                taskRef:
                  name: gate
                workspaces:
                  - name: shared
                    configMap:
                      name: gate-fixture-malformed
        - assert:
            timeout: 240s
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                name: gate-malformed
              status:
                (conditions[?type == 'Succeeded'] | [0].status): "False"
                (steps[?name == 'gate'] | [0].terminated.exitCode): 1
